/* ------------------------------ render ------------------------------ */
function render(){
  var c = ctx;
  /* coin radii change with the batch size, so sprites are rebuilt lazily */
  if (coinSpriteR !== L.trayR || panSpriteR !== L.panR) buildCoinSprites();
  c.setTransform(DPR,0,0,DPR,0,0);
  if (S.shake>0.002){
    var sx = Math.sin(S.now*57)*S.shake*11, sy = Math.cos(S.now*71)*S.shake*8;
    c.translate(sx, sy);
  }
  c.drawImage(bg, 0,0, W,H);

  /* candle-flicker ambience over the brass */
  if (G.amb && G.ambW>0 && G.ambH>0){
    c.save();
    c.globalCompositeOperation='lighter';
    var aa = 0.15 + 0.55*(S.flick-1);
    c.globalAlpha = aa<0 ? 0 : (aa>1?1:aa);
    c.fillStyle = G.amb;
    c.fillRect(G.ambX, G.ambY, G.ambW, G.ambH);
    c.restore();
  }

  drawLedger();
  drawCandle();
  drawScale();
  drawWeigh();
  drawAnvil();
  drawCoins();
  drawParts();
  drawResultPlaque();
  drawToast();
  if (S.mode==='banner') drawBanner();
  if (S.reveal) drawReveal();
  if (S.confirm) drawConfirm();
  c.setTransform(DPR,0,0,DPR,0,0);
}

/* =========================== game flow ============================== */
function makeCoins(n){
  var arr=[], i, s={x:0,y:0};
  for (i=0;i<n;i++){
    traySlot(i,s);
    /* coins drop the last inch into their own socket, so a big batch never
       rains across the ledger or the scale on its way in */
    arr.push({
      id:i, n:i+1, loc:'tray',
      x:s.x + rnd(-3,3), y:s.y - rnd(26,64),
      r:L.trayR*0.72, cleared:false, pending:false, clearT:0,
      shake:0, sel:false, drag:false,
      delay:i*0.014
    });
  }
  return arr;
}
function startRound(r){
  var cfg = roundConfig(r);
  S.round = r;
  if (r > S.bestRound) S.bestRound = r;
  S.n = cfg.n; S.unknown = cfg.unk; S.kMax = cfg.k; S.kUsed = 0;
  S.fake = Math.floor(Math.random()*cfg.n);
  S.fakeDir = cfg.unk ? (Math.random()<0.5?-1:1) : -1;
  S.hyp = buildHypotheses(cfg.n, cfg.unk);
  S.log = []; S.panL=[]; S.panR=[];
  S.candle = CANDLE_MAX;
  S.beamA=0; S.beamV=0; S.beamTarget=0;
  S.locked=false; S.hasResult=false; S.resultShow=0; S.result=0;
  S.drag=null; S.sel=-1; S.confirm=null; S.reveal=null; S.press=0;
  S.toast=null; S.numBuf='';
  S.timers.length = 0;
  /* the tray, ledger and pan grid all size themselves to the batch, so the
     whole layout is rebuilt when a batch changes */
  syncHUD(true);
  doResize();
  S.coins = makeCoins(cfg.n);
  ledgerDirty = true;
  S.mode='banner'; S.t=0;
  Snd.batch();
}
function nextRound(){ startRound(S.round+1); }
function rerollRound(){ startRound(S.round); }

function isDuplicate(){
  var kl = S.panL.slice().sort(numSort).join(','), kr = S.panR.slice().sort(numSort).join(',');
  var i;
  for (i=0;i<S.log.length;i++){
    var w=S.log[i];
    var al = w.L.slice().sort(numSort).join(','), ar = w.R.slice().sort(numSort).join(',');
    if ((al===kl && ar===kr) || (al===kr && ar===kl)) return true;
  }
  return false;
}
function numSort(a,b){ return a-b; }

function doWeigh(){
  if (S.mode!=='play' || S.locked || S.confirm || S.reveal) return;
  var st = weighState();
  if (!st.on){
    if (st.sub) showToast(st.sub, '#ffb0a4');
    Snd.deny();
    S.weighPress = 0;
    return;
  }
  Snd.unlock();
  var w = {L:S.panL.slice(), R:S.panR.slice(), out:0};
  w.out = predict({c:S.fake, d:S.fakeDir}, w);
  S.locked = true;
  S.weighFlash = 1;
  S.beamTarget = w.out*MAXA;
  Snd.creak();
  var i, cnt = Math.min(5, w.L.length+w.R.length);
  for (i=0;i<cnt;i++) Snd.clink(0.5, 0.04+i*0.045);

  after(1.10, function(){
    S.log.push(w);
    S.kUsed++;
    S.result = w.out; S.hasResult = true;
    ledgerDirty = true;
    var newly = refilter();
    var j;
    for (j=0;j<newly.length;j++){
      (function(id, k){
        after(0.10 + k*0.075, function(){
          var co = S.coins[id];
          if (!co) return;
          co.cleared = true; co.pending = false; co.clearT = 0;
          Snd.chk();
          var q;
          for (q=0;q<3;q++) spawn(co.x, co.y, rnd(-40,40), rnd(-90,-20), rnd(0.3,0.6), rnd(1,2.2), 2, 0, 300);
        });
      })(newly[j], j);
    }
    S.locked = false;
    syncHUD(false);
  });
}

function askAccuse(id){
  var co = S.coins[id]; if (!co) return;
  if (co.cleared){
    co.shake = 0.5;
    Snd.deny();
    showToast('COIN '+co.n+' IS PROVEN GENUINE', '#8fe2ab');
    if (co.loc!=='tray') { detach(id); co.loc='tray'; }
    return;
  }
  if (S.confirm || S.reveal || S.locked) return;
  detach(id);
  co.loc = 'anvil';
  S.confirm = {id:id, t:0};
  S.sel = -1;
  updateSel();
  Snd.press();
}
function cancelAccuse(){
  if (!S.confirm) return;
  var co = S.coins[S.confirm.id];
  if (co) co.loc='tray';
  S.confirm = null;
  Snd.clink(0.6,0);
}
function doAccuse(id){
  S.confirm = null;
  S.locked = true;
  S.press = 0;
  var co = S.coins[id];
  if (co) co.loc='anvil';
  Snd.press();
  after(0.34, function(){
    var ok = (id === S.fake);
    var ax = L.anvil.x + L.anvil.w*0.5, ay = L.anvil.y + L.anvil.h*0.45;
    Snd.thunk();
    S.shake = ok ? 0.35 : 0.9;
    if (ok){
      burstGold(ax, ay, 34, 320);
      Snd.chime();
      var base = 100*S.round;
      var spared = 150*(S.kMax-S.kUsed);
      var cand = Math.round(100*clamp(S.candle/CANDLE_MAX,0,1));
      var gain = base+spared+cand;
      S.score += gain;
      S.reveal = {ok:true, t:0, life:2.5, gain:gain,
        sub:'BASE '+base+'   ·   SPARED '+spared+'   ·   CANDLE '+cand};
      after(2.5, function(){ S.reveal=null; nextRound(); });
    } else {
      Snd.sting();
      S.seals--;
      crackSeal(S.seals);
      burstShards(ax, ay, 16, 1);
      var fakeCoin = S.coins[S.fake];
      S.reveal = {ok:false, t:0, life:2.9,
        sub:'COIN '+(fakeCoin?fakeCoin.n:'?')+' WAS THE FORGERY'};
      if (co) co.cleared = true;
      after(2.9, function(){
        S.reveal=null;
        if (S.seals<=0) gameOver();
        else rerollRound();
      });
    }
    syncHUD(false);
  });
}
function crackSeal(idx){
  var els = document.querySelectorAll('#seals .seal');
  if (idx<0 || idx>=els.length) return;
  var el = els[idx];
  el.classList.add('cracked','shatter');
  var b = el.getBoundingClientRect();
  var cx = b.left + b.width/2, cy = b.top + b.height/2;
  burstShards(cx, cy, 12, 1);
  Snd.crack();
}
function gameOver(){
  S.mode='over';
  S.locked=true;
  S.drag=null;
  Snd.over();
  showOver();
}

/* ------------------------- coin manipulation ------------------------ */
function detach(id){
  var i = S.panL.indexOf(id);
  if (i>=0){ S.panL.splice(i,1); onPansChanged(); return; }
  i = S.panR.indexOf(id);
  if (i>=0){ S.panR.splice(i,1); onPansChanged(); return; }
}
function onPansChanged(){
  S.beamTarget = 0;
  S.hasResult = false;
}
function placeCoin(id, dest){
  var co = S.coins[id]; if (!co) return false;
  if (dest==='L' || dest==='R'){
    var arr = dest==='L' ? S.panL : S.panR;
    if (co.loc===dest) return false;
    if (arr.length >= L.panCap){
      co.shake = 0.4;
      Snd.deny();
      showToast('THE PAN WILL HOLD NO MORE', '#ffb0a4');
      return false;
    }
    detach(id);
    arr.push(id);
    co.loc = dest;
    onPansChanged();
    Snd.clink(0.85,0);
    return true;
  }
  if (dest==='tray'){
    if (co.loc==='tray') return false;
    detach(id);
    co.loc='tray';
    Snd.clink(0.6,0);
    return true;
  }
  return false;
}

/* ============================== input =============================== */
function evPos(e){
  return {x:e.clientX, y:e.clientY};
}
function coinAt(x,y){
  var i, best=-1, bd=1e9;
  for (i=S.coins.length-1;i>=0;i--){
    var co=S.coins[i];
    if (co.loc==='anvil') continue;
    var dx=x-co.x, dy=y-co.y, d=dx*dx+dy*dy;
    var rr = Math.max(co.r*1.2, 13);
    if (d < rr*rr && d<bd){ bd=d; best=i; }
  }
  return best;
}
function inRect(x,y,r,pad){
  pad=pad||0;
  return x>=r.x-pad && x<=r.x+r.w+pad && y>=r.y-pad && y<=r.y+r.h+pad;
}
function panHit(x,y,side){
  var p = panPos(side);
  var dx = (x-p.x)/(L.panR*1.42), dy=(y-(p.y-L.panR*0.25))/(L.panR*1.05);
  return dx*dx+dy*dy <= 1;
}
function targetAt(x,y){
  if (panHit(x,y,'L')) return 'L';
  if (panHit(x,y,'R')) return 'R';
  if (inRect(x,y,L.anvil,6)) return 'anvil';
  if (inRect(x,y,L.tray,4)) return 'tray';
  return '';
}

function onDown(e){
  Snd.unlock();
  if (S.paused){ resumeGame(); return; }
  if (S.mode==='title' || S.mode==='over') return;
  var p = evPos(e);
  if (e.pointerId!==undefined && cv.setPointerCapture){
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  }
  if (S.confirm){
    if (inRect(p.x,p.y,HIT.yes)) doAccuse(S.confirm.id);
    else if (inRect(p.x,p.y,HIT.no)) cancelAccuse();
    else if (!inRect(p.x,p.y,HIT.panel,6)) cancelAccuse();
    return;
  }
  if (S.mode==='banner'){
    if (S.t>0.3) S.t = 99;
    return;
  }
  if (S.reveal || S.locked) return;

  /* weigh button */
  if (inRect(p.x,p.y,L.weigh,2)){ S.weighPress=1; S.pressWeigh=true; return; }

  var id = coinAt(p.x,p.y);
  if (id>=0){
    S.drag = {id:id, x:p.x, y:p.y, sx:p.x, sy:p.y, moved:false, t0:S.now, from:S.coins[id].loc};
    return;
  }
  /* tap a target with a selected coin */
  if (S.sel>=0){
    var t = targetAt(p.x,p.y);
    if (t==='anvil'){ askAccuse(S.sel); return; }
    if (t){ placeCoin(S.sel, t); return; }
  }
  if (inRect(p.x,p.y,L.anvil,6)) { showToast('DROP A COIN HERE TO ACCUSE IT','#ffc9a0'); return; }
  /* tap empty felt clears selection */
  if (S.sel>=0){ S.sel=-1; updateSel(); }
}
function onMove(e){
  if (!S.drag){
    if (S.pressWeigh) return;
    return;
  }
  var p = evPos(e);
  var d = S.drag;
  d.x=p.x; d.y=p.y;
  if (!d.moved){
    var dx=p.x-d.sx, dy=p.y-d.sy;
    if (dx*dx+dy*dy > 42){
      d.moved = true;
      var co = S.coins[d.id];
      detach(d.id);
      co.loc='drag'; co.drag=true;
      S.sel=-1; updateSel();
      Snd.clink(0.7,0);
    }
  }
  if (d.moved){
    S.hoverTarget = targetAt(p.x,p.y);
  }
}
function onUp(e){
  if (S.pressWeigh){
    S.pressWeigh=false; S.weighPress=0;
    var pp = evPos(e);
    if (inRect(pp.x,pp.y,L.weigh,10)) doWeigh();
    return;
  }
  var d = S.drag;
  if (!d) return;
  S.drag = null;
  S.hoverTarget='';
  var co = S.coins[d.id];
  if (!co) return;
  if (!d.moved){
    /* a tap: select / deselect */
    if (S.sel===d.id){ S.sel=-1; }
    else { S.sel=d.id; Snd.clink(0.45,0); }
    updateSel();
    return;
  }
  co.drag = false;
  var p = evPos(e);
  var t = targetAt(p.x,p.y);
  if (t==='anvil'){ co.loc='tray'; askAccuse(d.id); return; }
  if (t==='L' || t==='R'){
    co.loc='tray';
    if (!placeCoin(d.id,t)) co.loc='tray';
    return;
  }
  co.loc='tray';
  Snd.clink(0.55,0);
}
function updateSel(){
  var i;
  for (i=0;i<S.coins.length;i++) S.coins[i].sel = (i===S.sel);
}
function moveSel(delta){
  if (!S.coins.length) return;
  var s = S.sel;
  if (s<0) s = (delta>0? -1 : 0);
  s = ((s+delta) % S.coins.length + S.coins.length) % S.coins.length;
  S.sel = s; updateSel();
  Snd.clink(0.30,0);
}

function onKey(e){
  var k = e.key;
  if (S.paused){ resumeGame(); e.preventDefault(); return; }
  if (k==='m' || k==='M'){ toggleMute(); e.preventDefault(); return; }
  Snd.unlock();
  /* a focused button turns Enter/Space into a synthetic click; let it own them */
  if ((k==='Enter'||k===' ') && (document.activeElement===btnEl || document.activeElement===muteBtn)) return;
  if (S.mode==='title'){
    if (k==='Enter' || k===' '){ e.preventDefault(); beginGame(); }
    return;
  }
  if (S.mode==='over'){
    if (k==='Enter' || k===' '){ e.preventDefault(); restart(); }
    return;
  }
  if (S.confirm){
    if (k==='Enter' || k==='y' || k==='Y'){ e.preventDefault(); doAccuse(S.confirm.id); }
    else if (k==='Escape' || k==='n' || k==='N' || k==='Backspace'){ e.preventDefault(); cancelAccuse(); }
    return;
  }
  if (S.mode==='banner'){
    if (S.t>0.3) S.t=99;
    e.preventDefault();
    return;
  }
  if (k==='Escape'){ e.preventDefault(); pauseGame(); return; }
  if (S.reveal || S.locked) return;

  if (k>='0' && k<='9'){
    e.preventDefault();
    if (S.now - S.numBufT > 0.9) S.numBuf='';
    S.numBufT = S.now;
    S.numBuf += k;
    var v = parseInt(S.numBuf,10);
    if (v>=1 && v<=S.coins.length){ S.sel = v-1; updateSel(); Snd.clink(0.32,0); }
    else { S.numBuf = k; v = parseInt(k,10);
      if (v>=1 && v<=S.coins.length){ S.sel=v-1; updateSel(); Snd.clink(0.32,0); } }
    return;
  }
  switch(k){
    case 'ArrowRight': moveSel(1); e.preventDefault(); break;
    case 'ArrowLeft': moveSel(-1); e.preventDefault(); break;
    case 'ArrowDown': moveSel(L.trayCols); e.preventDefault(); break;
    case 'ArrowUp': moveSel(-L.trayCols); e.preventDefault(); break;
    case 'l': case 'L': if (S.sel>=0) placeCoin(S.sel,'L'); e.preventDefault(); break;
    case 'r': case 'R': if (S.sel>=0) placeCoin(S.sel,'R'); e.preventDefault(); break;
    case 'Backspace': case 'Delete':
      if (S.sel>=0) placeCoin(S.sel,'tray'); e.preventDefault(); break;
    case 'a': case 'A': if (S.sel>=0) askAccuse(S.sel); e.preventDefault(); break;
    case 'Enter': case ' ': doWeigh(); e.preventDefault(); break;
  }
}

/* ============================== HUD ================================= */
var hudEl = document.getElementById('hud');
var scoreV = document.getElementById('scoreV');
var batchV = document.getElementById('batchV');
var ruleV = document.getElementById('ruleV');
var weightsEl = document.getElementById('weights');
var sealsEl = document.getElementById('seals');
var lastScoreShown = -1, lastWeights = -1, lastKmax = -1;

function buildSeals(){
  sealsEl.innerHTML='';
  var i;
  for (i=0;i<3;i++){
    var d = document.createElement('div');
    d.className='seal';
    sealsEl.appendChild(d);
  }
}
function syncHUD(full){
  if (full || lastKmax!==S.kMax){
    weightsEl.innerHTML='';
    var i;
    for (i=0;i<S.kMax;i++){
      var d=document.createElement('div'); d.className='wt'; weightsEl.appendChild(d);
    }
    lastKmax = S.kMax; lastWeights = -1;
  }
  if (lastWeights !== S.kUsed){
    var els = weightsEl.children, j;
    for (j=0;j<els.length;j++){
      if (j < S.kMax-S.kUsed) els[j].classList.remove('spent');
      else els[j].classList.add('spent');
    }
    lastWeights = S.kUsed;
  }
  batchV.textContent = 'Batch '+roman(S.round);
  /* keep the rule on one line - a wrapped HUD steals height from the scale */
  var narrow = window.innerWidth < 560;
  ruleV.textContent = S.unknown
    ? (narrow ? 'Light or heavy?' : 'The fake may be light OR heavy')
    : (narrow ? 'The alloy is light' : "The forger's alloy is light");
}
function hudTick(){
  var v = Math.round(S.scoreShown);
  if (v !== lastScoreShown){
    scoreV.textContent = v;
    lastScoreShown = v;
  }
}

/* ============================ screens =============================== */
var screenEl = document.getElementById('screen');
var cardEl = document.getElementById('card');
var eyeEl = document.getElementById('scEyebrow');
var titleEl = document.getElementById('scTitle');
var subEl = document.getElementById('scSub');
var bodyEl = document.getElementById('scBody');
var btnEl = document.getElementById('scBtn');
var footEl = document.getElementById('scFoot');
var pauseEl = document.getElementById('pausev');

function showScreen(){ screenEl.classList.add('on'); }
function hideScreen(){ screenEl.classList.remove('on'); }

function showTitle(){
  eyeEl.textContent = 'The Royal Mint · Night Shift';
  titleEl.textContent = 'ASSAY';
  subEl.innerHTML = 'A batch of freshly struck coins lands on your bench and exactly one of them is <em>false</em>. '+
    'You have a brass balance, a few weighings, and three wax seals of credit with the Crown. '+
    'Weigh, reason, and stamp the forgery.';
  bodyEl.innerHTML =
    '<div class="howto">'+
      '<div class="ht"><b>Drag</b><span>Pull coins from the tray onto the left or right pan. Drag them back off to unload.</span></div>'+
      '<div class="ht"><b>Weigh</b><span>The beam tips toward the heavier side. Every weighing is written into your ledger.</span></div>'+
      '<div class="ht"><b>Seal</b><span>Coins the evidence has already proven true get a green seal. They lock — but they still make excellent reference weights.</span></div>'+
      '<div class="ht"><b>Accuse</b><span>Drag your suspect onto the anvil and stamp it. Accuse early for a bigger purse; a wrong stamp cracks a seal.</span></div>'+
    '</div>'+
    '<div class="keys">'+
      '<kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> or <kbd>0-9</kbd> select a coin &nbsp;·&nbsp; '+
      '<kbd>L</kbd>/<kbd>R</kbd> load a pan &nbsp;·&nbsp; <kbd>Bksp</kbd> unload<br>'+
      '<kbd>Enter</kbd> weigh &nbsp;·&nbsp; <kbd>A</kbd> accuse &nbsp;·&nbsp; <kbd>M</kbd> mute &nbsp;·&nbsp; <kbd>Esc</kbd> pause'+
    '</div>';
  btnEl.textContent = 'Begin';
  btnEl.style.display='';
  footEl.textContent = 'The candle burns while you think';
  cardEl.classList.remove('bare');
  showScreen();
}
function showOver(){
  eyeEl.textContent = 'The seals are spent';
  titleEl.textContent = 'Dismissed';
  subEl.innerHTML = 'The forger walks free and the Mint finds another assayer. '+
    'Every batch you cleared still counts toward your name.';
  bodyEl.innerHTML =
    '<div id="stats">'+
      '<div class="stat"><div class="sv">'+S.score+'</div><div class="sl">Final score</div></div>'+
      '<div class="stat"><div class="sv">'+(S.round-1)+'</div><div class="sl">Batches cleared</div></div>'+
      '<div class="stat"><div class="sv">'+roman(S.bestRound)+'</div><div class="sl">Deepest batch</div></div>'+
    '</div>';
  btnEl.textContent = 'Try again';
  btnEl.style.display='';
  footEl.textContent = 'Enter to restart';
  cardEl.classList.remove('bare');
  showScreen();
}

function beginGame(){
  hideScreen();
  try{ btnEl.blur(); }catch(e){}
  hudEl.classList.add('on');
  S.mode='play';
  startRound(1);
}
function restart(){
  /* full reset - no page reload */
  S.timers.length = 0;
  var i;
  for (i=0;i<PARTMAX;i++) partPool[i].live=false;
  S.score=0; S.scoreShown=0; lastScoreShown=-1;
  S.seals=3; S.bestRound=1;
  S.shake=0; S.press=0; S.locked=false;
  S.drag=null; S.confirm=null; S.reveal=null; S.toast=null;
  S.pressWeigh=false; S.weighPress=0; S.weighFlash=0;
  buildSeals();
  hideScreen();
  try{ btnEl.blur(); }catch(e){}
  hudEl.classList.add('on');
  S.mode='play';
  startRound(1);
}

btnEl.addEventListener('click', function(e){
  e.preventDefault();
  Snd.unlock();
  if (S.mode==='title') beginGame();
  else if (S.mode==='over') restart();
});

/* ------------------------------ mute -------------------------------- */
var muteBtn = document.getElementById('mute');
function toggleMute(){
  Snd.setMuted(!Snd.muted);
  muteBtn.classList.toggle('off', Snd.muted);
}
muteBtn.addEventListener('click', function(e){
  e.preventDefault(); e.stopPropagation();
  Snd.unlock(); toggleMute();
  try{ muteBtn.blur(); }catch(err){}
});

/* ------------------------------ pause ------------------------------- */
function pauseGame(){
  if (S.paused) return;
  if (S.mode!=='play' && S.mode!=='banner') return;
  S.paused = true;
  /* drop any drag safely */
  if (S.drag){
    var co = S.coins[S.drag.id];
    if (co){ co.drag=false; co.loc='tray'; }
    S.drag=null; S.hoverTarget='';
  }
  S.pressWeigh=false; S.weighPress=0;
  pauseEl.classList.add('on');
}
function resumeGame(){
  if (!S.paused) return;
  S.paused=false;
  pauseEl.classList.remove('on');
}
pauseEl.addEventListener('pointerdown', function(e){ e.preventDefault(); resumeGame(); });
window.addEventListener('blur', pauseGame);
document.addEventListener('visibilitychange', function(){ if (document.hidden) pauseGame(); });

/* ---------------------------- listeners ----------------------------- */
cv.addEventListener('pointerdown', function(e){ e.preventDefault(); onDown(e); }, {passive:false});
window.addEventListener('pointermove', function(e){ onMove(e); }, {passive:false});
window.addEventListener('pointerup', function(e){ onUp(e); }, {passive:false});
window.addEventListener('pointercancel', function(e){ onUp(e); }, {passive:false});
window.addEventListener('keydown', onKey, {passive:false});
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
/* only the play surface swallows touch scrolling - the title card may scroll */
cv.addEventListener('touchmove', function(e){ if (e.cancelable) e.preventDefault(); }, {passive:false});
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });

var resizeTimer = 0;
function doResize(){
  syncHUD(false);       /* rule text is width-dependent; set it before measuring */
  computeLayout();
  buildGradients();
  buildAmbient();
  buildCoinSprites();
}
window.addEventListener('resize', function(){
  doResize();
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(doResize, 200);
});
window.addEventListener('orientationchange', function(){
  doResize();
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(doResize, 260);
});
/* The steady candlelight wash is baked into the background once.  Only the
   flicker is drawn live, and it is confined to the brass around the scale -
   a second full-screen composited pass costs ~20ms on a software rasteriser
   and buys almost nothing visually. */
function buildAmbient(){
  var gx = L.cx, gy = L.beamY + L.rope*0.35;
  var rr = Math.max(L.beamHalf*1.30, 150);
  var g = ctx.createRadialGradient(gx, gy, 4, gx, gy, rr);
  g.addColorStop(0,'rgba(255,196,116,.55)');
  g.addColorStop(.42,'rgba(255,158,74,.18)');
  g.addColorStop(1,'rgba(255,150,64,0)');
  G.amb = g;
  G.ambX = Math.max(0, gx-rr); G.ambY = Math.max(0, gy-rr);
  G.ambW = Math.min(W, gx+rr) - G.ambX;
  G.ambH = Math.min(H, gy+rr) - G.ambY;
}

/* ============================= update =============================== */
function update(dt){
  S.now += dt;
  S.t += dt;
  runTimers();

  /* candle flicker */
  S.flick = 1 + 0.055*Math.sin(S.now*7.3) + 0.035*Math.sin(S.now*3.1+1.7)
              + 0.025*Math.sin(S.now*17.4+0.6);

  /* beam spring (substepped) */
  var steps = Math.min(8, Math.max(1, Math.ceil(dt*120)));
  var sdt = dt/steps, i;
  for (i=0;i<steps;i++){
    var acc = (S.beamTarget-S.beamA)*95 - S.beamV*9.4;
    S.beamV += acc*sdt;
    S.beamA += S.beamV*sdt;
  }

  /* mode timing */
  if (S.mode==='banner' && S.t>=1.6){ S.mode='play'; S.t=0; }

  /* candle burn */
  if (S.mode==='play' && !S.reveal && !S.confirm && S.candle>0){
    S.candle = Math.max(0, S.candle - dt);
  }

  /* coins */
  var co, tgt=_tg;
  for (i=0;i<S.coins.length;i++){
    co = S.coins[i];
    if (co.delay>0){ co.delay -= dt; }
    if (co.shake>0) co.shake = Math.max(0, co.shake - dt*1.6);
    if (co.cleared && co.clearT<1) co.clearT = Math.min(1, co.clearT + dt*3.4);
    if (co.drag && S.drag){
      co.x = approach(co.x, S.drag.x, 34, dt);
      co.y = approach(co.y, S.drag.y, 34, dt);
      co.r = approach(co.r, L.trayR*1.16, 18, dt);
      continue;
    }
    if (co.delay>0) continue;
    coinTarget(co, tgt);
    var rate = (co.loc==='L'||co.loc==='R') ? 24 : 17;
    co.x = approach(co.x, tgt.x, rate, dt);
    co.y = approach(co.y, tgt.y, rate, dt);
    co.r = approach(co.r, tgt.r, 15, dt);
  }

  /* animation values */
  S.scoreShown = approach(S.scoreShown, S.score, 6, dt);
  S.shake = S.shake>0.001 ? S.shake*Math.exp(-6.5*dt) : 0;
  S.resultShow = approach(S.resultShow, S.hasResult?1:0, 9, dt);
  S.weighFlash = Math.max(0, S.weighFlash - dt*3.2);
  S.weighPress = approach(S.weighPress, S.pressWeigh?1:0, 26, dt);
  if (S.confirm) S.confirm.t += dt;
  if (S.reveal){
    S.reveal.t += dt;
    S.press = approach(S.press, 0.05, 4, dt);
  } else if (S.locked && S.mode==='play' && anyOnAnvil()){
    S.press = Math.min(1, S.press + dt*4.2);
  } else {
    S.press = approach(S.press, 0, 8, dt);
  }
  if (S.toast){
    S.toast.t += dt;
    if (S.toast.t >= S.toast.life) S.toast = null;
  }
  updateParts(dt);
}
function anyOnAnvil(){
  var i;
  for (i=0;i<S.coins.length;i++) if (S.coins[i].loc==='anvil') return true;
  return false;
}

/* ============================== loop ================================ */
var lastT = 0;
function frame(now){
  requestAnimationFrame(frame);
  if (!lastT) lastT = now;
  var d = (now-lastT)/1000;
  lastT = now;
  if (!(d>0)) d=0;
  if (d>MAXFRAME) d=MAXFRAME;
  if (!S.paused) update(d);
  hudTick();
  render();
}

/* ============================== boot ================================ */
function boot(){
  S.n = 5;
  S.coins = [];
  buildSeals();
  syncHUD(true);      /* fill the HUD first: layout measures its height */
  computeLayout();
  buildGradients();
  buildAmbient();
  buildCoinSprites();
  showTitle();
  requestAnimationFrame(frame);
}
boot();

})();
