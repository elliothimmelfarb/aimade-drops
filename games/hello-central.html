<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="HELLO CENTRAL - night shift at a 1926 telephone exchange. Drag physical patch cords, connect the calls, keep the town talking.">
<title>HELLO CENTRAL</title>
<style>
  :root{
    --cream:#f2e5c9;
    --cream-dim:rgba(242,229,201,.58);
    --brass:#c9a35e;
    --walnut:#241611;
    --ink:#2a1a12;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, "Times New Roman", serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:#100a07;color:#f2e5c9;
    font-family:var(--serif);
    overflow:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
    touch-action:none;
  }
  #wrap{position:fixed;inset:0;overflow:hidden;background:#100a07;}
  canvas#game{position:absolute;left:0;top:0;display:block;touch-action:none;}

  /* ------------- overlays ------------- */
  #ov{
    position:absolute;inset:0;z-index:10;display:flex;
    visibility:hidden;pointer-events:none;touch-action:pan-y;
    align-items:center;justify-content:center;
    padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
    background:radial-gradient(120% 90% at 50% 40%, rgba(12,7,4,.62) 0%, rgba(8,4,2,.9) 70%, rgba(6,3,1,.96) 100%);
    opacity:0;transition:opacity .38s ease, visibility .38s;
  }
  #ov.on{visibility:visible;pointer-events:auto;opacity:1;}
  .card{
    position:relative;width:min(560px,100%);max-height:100%;overflow:auto;touch-action:pan-y;
    padding:clamp(18px,4vw,32px) clamp(16px,4.4vw,38px) clamp(20px,4vw,32px);
    text-align:center;
    background:
      linear-gradient(180deg, rgba(255,248,232,.055), rgba(255,240,215,.015)),
      linear-gradient(170deg,#2c1a12 0%, #1d100a 60%, #170c07 100%);
    border:1px solid rgba(214,176,110,.34);
    border-radius:5px;
    box-shadow:0 26px 70px rgba(0,0,0,.72), inset 0 1px 0 rgba(255,232,190,.1), inset 0 0 46px rgba(0,0,0,.5);
    transform:translateY(12px) scale(.985);opacity:0;
    transition:transform .5s cubic-bezier(.16,1,.3,1), opacity .45s ease;
  }
  #ov.on .card{transform:none;opacity:1;}
  .card::after{
    content:"";position:absolute;inset:6px;border:1px solid rgba(214,176,110,.16);border-radius:3px;pointer-events:none;
  }
  .eyebrow{
    font-size:clamp(8.5px,2.2vw,10px);letter-spacing:.42em;text-transform:uppercase;
    color:rgba(214,176,110,.72);margin:0 0 10px;
  }
  h1{
    margin:0;font-weight:400;
    font-size:clamp(30px,9.6vw,54px);line-height:.98;letter-spacing:.13em;
    color:#f6ead1;
    text-shadow:0 2px 0 rgba(0,0,0,.5), 0 0 34px rgba(255,186,96,.22);
  }
  h1 .amp{display:block;font-size:.42em;letter-spacing:.34em;margin-top:.72em;color:rgba(214,176,110,.8);}
  h2{
    margin:0 0 6px;font-weight:400;
    font-size:clamp(20px,6vw,32px);letter-spacing:.16em;text-transform:uppercase;color:#f6ead1;
  }
  .rule{
    height:1px;margin:16px auto;width:74%;
    background:linear-gradient(90deg,transparent,rgba(214,176,110,.5),transparent);
  }
  .lede{
    margin:0 auto;max-width:40ch;
    font-size:clamp(12px,3.3vw,14.5px);line-height:1.62;color:rgba(242,229,201,.76);
  }
  .lede b{color:#f3dfb2;font-weight:600;}
  ol.steps{
    margin:14px auto 0;padding:0;max-width:42ch;list-style:none;
    text-align:left;font-size:clamp(11.5px,3.1vw,13.5px);line-height:1.5;color:rgba(242,229,201,.78);
  }
  ol.steps li{position:relative;padding:5px 0 5px 26px;}
  ol.steps li::before{
    content:counter(li);counter-increment:li;
    position:absolute;left:0;top:5px;width:17px;height:17px;line-height:17px;text-align:center;
    font-size:9.5px;color:#f0d79c;border:1px solid rgba(214,176,110,.44);border-radius:50%;
  }
  ol.steps{counter-reset:li;}
  .btn{
    display:inline-block;margin-top:22px;cursor:pointer;
    padding:13px 30px;border-radius:3px;
    font-family:var(--serif);font-size:clamp(12px,3.2vw,14px);letter-spacing:.26em;text-transform:uppercase;
    color:#2a1a10;
    background:linear-gradient(180deg,#eed7a2 0%, #c9a35e 52%, #a9803f 100%);
    border:1px solid rgba(255,236,196,.5);
    box-shadow:0 8px 22px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.5), inset 0 -2px 0 rgba(90,58,20,.35);
    transition:transform .16s cubic-bezier(.2,1.6,.4,1), box-shadow .16s ease, filter .16s ease;
    -webkit-appearance:none;appearance:none;
  }
  .btn:hover{transform:translateY(-1px);filter:brightness(1.06);}
  .btn:active{transform:translateY(1px) scale(.985);box-shadow:0 4px 12px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.35);}
  .stats{
    display:flex;flex-wrap:wrap;justify-content:center;gap:10px 6px;margin:18px 0 2px;
  }
  .stat{
    flex:1 1 30%;min-width:88px;padding:10px 6px;
    border:1px solid rgba(214,176,110,.18);border-radius:3px;background:rgba(255,236,200,.028);
  }
  .stat .k{font-size:8px;letter-spacing:.28em;text-transform:uppercase;color:rgba(214,176,110,.66);}
  .stat .v{font-size:clamp(19px,5.4vw,26px);color:#f6ead1;margin-top:4px;font-variant-numeric:tabular-nums;}
  .rank{
    margin-top:16px;font-size:clamp(13px,3.6vw,16px);letter-spacing:.2em;text-transform:uppercase;color:#f0d79c;
  }
  .note{
    margin:16px auto 0;max-width:38ch;text-align:left;
    padding:14px 16px;border-left:2px solid rgba(214,176,110,.4);
    background:rgba(255,236,200,.03);
    font-size:clamp(11.5px,3.1vw,13px);line-height:1.66;color:rgba(242,229,201,.72);font-style:italic;
  }
  .note .sig{display:block;margin-top:10px;font-style:normal;letter-spacing:.16em;font-size:9.5px;text-transform:uppercase;color:rgba(214,176,110,.7);}
  .hint{margin-top:14px;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:rgba(242,229,201,.34);}
  #pauseCard{cursor:pointer;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="ov"><div class="card" id="card"></div></div>
</div>
<script>
(function(){
'use strict';

/* ============================================================
   HELLO CENTRAL — 1926 switchboard night shift
   Single-file arcade. Canvas + WebAudio, no external assets.
   ============================================================ */

var TAU = Math.PI*2, PI = Math.PI;
var min=Math.min, max=Math.max, abs=Math.abs, sqrt=Math.sqrt, floor=Math.floor, cos=Math.cos, sin=Math.sin;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function rand(a,b){ return a+Math.random()*(b-a); }
function randi(n){ return (Math.random()*n)|0; }
function pick(arr){ return arr[(Math.random()*arr.length)|0]; }
function ease(t){ return t<0?0:t>1?1:t*t*(3-2*t); }
function easeOut(t){ t=clamp(t,0,1); return 1-(1-t)*(1-t)*(1-t); }

/* ---------------- canvas ---------------- */
var cv = document.getElementById('game');
var ctx = cv.getContext('2d', {alpha:false});
var ovEl = document.getElementById('ov');
var cardEl = document.getElementById('card');
var W=0, H=0, DPR=1;

/* offscreen static board layer */
var board = document.createElement('canvas');
var bctx = board.getContext('2d');
var vignette = null;

/* ---------------- audio ---------------- */
var A = {
  ctx:null, master:null, muted:false, noise:null, ready:false, murmurs:[]
};
function audioInit(){
  if (A.ctx) return;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try{
    A.ctx = new AC();
    A.master = A.ctx.createGain();
    A.master.gain.value = A.muted?0:0.25;
    A.master.connect(A.ctx.destination);
    // shared noise buffer (2s pink-ish)
    var sr = A.ctx.sampleRate, len = floor(sr*2), buf = A.ctx.createBuffer(1, len, sr);
    var d = buf.getChannelData(0), b0=0,b1=0,b2=0;
    for (var i=0;i<len;i++){
      var wn = Math.random()*2-1;
      b0 = 0.99765*b0 + wn*0.0990460;
      b1 = 0.96300*b1 + wn*0.2965164;
      b2 = 0.57000*b2 + wn*1.0526913;
      d[i] = clamp((b0+b1+b2+wn*0.1848)*0.22, -1, 1);
    }
    A.noise = buf;
    A.ready = true;
  }catch(e){ A.ctx=null; A.ready=false; }
}
function audioResume(){
  if (!A.ctx){ audioInit(); }
  if (A.ctx && A.ctx.state === 'suspended'){ try{ A.ctx.resume().catch(function(){}); }catch(e){} }
}
function now(){ return A.ctx ? A.ctx.currentTime : 0; }
function noiseSrc(){
  var s = A.ctx.createBufferSource();
  s.buffer = A.noise; s.loop = true;
  s.playbackRate.value = rand(0.92,1.08);
  return s;
}
function envGain(t0, peak, atk, dec){
  var g = A.ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(max(peak,0.0002), t0+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+atk+dec);
  return g;
}
function tone(type, f0, f1, t0, dur, peak, dest){
  if (!A.ready) return;
  var o = A.ctx.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f0, t0);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(max(f1,1), t0+dur);
  var g = envGain(t0, peak, min(0.012,dur*0.25), dur);
  o.connect(g); g.connect(dest||A.master);
  o.start(t0); o.stop(t0+dur+0.06);
  o.onended = function(){ try{ o.disconnect(); g.disconnect(); }catch(e){} };
}
function noiseBurst(t0, dur, peak, filterType, freq, q, dest){
  if (!A.ready) return;
  var s = noiseSrc();
  var f = A.ctx.createBiquadFilter();
  f.type = filterType; f.frequency.setValueAtTime(freq, t0); f.Q.value = q||1;
  var g = envGain(t0, peak, 0.004, dur);
  s.connect(f); f.connect(g); g.connect(dest||A.master);
  s.start(t0); s.stop(t0+dur+0.05);
  s.onended = function(){ try{ s.disconnect(); f.disconnect(); g.disconnect(); }catch(e){} };
}

/* --- specific sounds --- */
function sndRing(){
  if (!A.ready) return;
  var t = now()+0.001;
  for (var k=0;k<2;k++){
    var t0 = t + k*0.20;
    ringBurst(t0);
  }
}
function ringBurst(t0){
  var freqs = [1046, 1318], amps=[0.13,0.095];
  for (var i=0;i<2;i++){
    var o = A.ctx.createOscillator();
    o.type='sine'; o.frequency.setValueAtTime(freqs[i]*rand(0.995,1.005), t0);
    var g = A.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(amps[i], t0+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+0.19);
    // gentle clapper body
    var f = A.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freqs[i]; f.Q.value=6;
    o.connect(g); g.connect(f); f.connect(A.master);
    o.start(t0); o.stop(t0+0.24);
    (function(o,g,f){ o.onended=function(){ try{o.disconnect();g.disconnect();f.disconnect();}catch(e){} }; })(o,g,f);
  }
  noiseBurst(t0, 0.03, 0.05, 'bandpass', 2600, 3);
}
function sndChunk(){
  if (!A.ready) return;
  var t = now()+0.001;
  noiseBurst(t, 0.055, 0.28, 'lowpass', 1100, 1.2);
  tone('sine', 150, 62, t, 0.11, 0.3);
  tone('triangle', 420, 240, t, 0.05, 0.09);
}
function sndPop(){
  if (!A.ready) return;
  var t = now()+0.001;
  tone('sine', 520, 190, t, 0.07, 0.16);
  noiseBurst(t, 0.03, 0.1, 'highpass', 1800, 1);
}
function sndErr(){
  if (!A.ready) return;
  var t = now()+0.001;
  var o = A.ctx.createOscillator(), o2 = A.ctx.createOscillator();
  o.type='square'; o2.type='square';
  o.frequency.setValueAtTime(148,t); o2.frequency.setValueAtTime(157,t);
  var g = A.ctx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.13,t+0.01);
  g.gain.setValueAtTime(0.13,t+0.16);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.30);
  var f = A.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1400;
  o.connect(g); o2.connect(g); g.connect(f); f.connect(A.master);
  o.start(t); o2.start(t); o.stop(t+0.34); o2.stop(t+0.34);
  o.onended=function(){ try{o.disconnect();o2.disconnect();g.disconnect();f.disconnect();}catch(e){} };
}
function sndReject(){
  if (!A.ready) return;
  var t = now()+0.001;
  tone('square', 300, 300, t, 0.07, 0.07);
  tone('square', 300, 300, t+0.11, 0.07, 0.07);
}
function sndClick(v){
  if (!A.ready) return;
  noiseBurst(now()+0.001, 0.018, v||0.13, 'highpass', 2200, 1);
}
function sndEndCall(){
  if (!A.ready) return;
  var t = now()+0.001;
  noiseBurst(t, 0.022, 0.09, 'bandpass', 1500, 2);
  tone('sine', 300, 200, t, 0.05, 0.05);
}
function sndHangup(){
  if (!A.ready) return;
  var t = now()+0.001;
  noiseBurst(t, 0.03, 0.16, 'highpass', 1200, 1);
  tone('square', 220, 90, t+0.02, 0.13, 0.09);
}
function sndSpark(){
  if (!A.ready) return;
  var t = now()+0.001;
  noiseBurst(t, 0.07, 0.13, 'bandpass', rand(2600,4600), 2.4);
  noiseBurst(t+0.04, 0.05, 0.08, 'highpass', 3200, 1);
}
function sndMercy(){
  if (!A.ready) return;
  var t = now()+0.001;
  tone('triangle', 587.33, 587.33, t, 0.24, 0.075);
  tone('triangle', 880.00, 880.00, t+0.09, 0.34, 0.075);
  tone('sine',    1174.7, 1174.7, t+0.18, 0.44, 0.045);
  noiseBurst(t+0.18, 0.16, 0.03, 'bandpass', 5200, 2.6);
}
function sndTrunkDone(){
  if (!A.ready) return;
  var t=now()+0.001;
  tone('sine', 660, 660, t, 0.09, 0.09);
  tone('sine', 880, 880, t+0.10, 0.13, 0.09);
}
function sndWin(){
  if (!A.ready) return;
  var t = now()+0.03;
  var notes=[523.25,659.25,783.99,1046.5,1318.5];
  for (var i=0;i<notes.length;i++){
    tone('triangle', notes[i], notes[i], t+i*0.13, 0.42, 0.11);
    tone('sine', notes[i]*2, notes[i]*2, t+i*0.13, 0.22, 0.035);
  }
  tone('sine', 261.6, 261.6, t+0.65, 0.9, 0.07);
}
function sndFired(){
  if (!A.ready) return;
  var t = now()+0.03;
  var seq=[[233.1,0],[207.7,0.26],[185.0,0.52],[155.6,0.80]];
  for (var i=0;i<seq.length;i++){
    var f=seq[i][0], d=seq[i][1];
    var o=A.ctx.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(f, t+d);
    o.frequency.linearRampToValueAtTime(f*0.94, t+d+0.30);
    var g=A.ctx.createGain();
    g.gain.setValueAtTime(0.0001,t+d);
    g.gain.exponentialRampToValueAtTime(0.10,t+d+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d+(i===3?0.9:0.30));
    var fl=A.ctx.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=900;
    o.connect(g); g.connect(fl); fl.connect(A.master);
    o.start(t+d); o.stop(t+d+1.1);
    (function(o,g,fl){o.onended=function(){try{o.disconnect();g.disconnect();fl.disconnect();}catch(e){}};})(o,g,fl);
  }
}
/* murmur: per-call filtered noise babble */
function murmurStart(){
  if (!A.ready) return null;
  try{
    var s = noiseSrc();
    var bp = A.ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=rand(380,720); bp.Q.value=1.4;
    var lp = A.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1400;
    var g = A.ctx.createGain();
    var t = now();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.030, t+0.25);
    // wobble
    var lfo = A.ctx.createOscillator(); lfo.type='sine'; lfo.frequency.value=rand(1.6,3.4);
    var lg = A.ctx.createGain(); lg.gain.value=0.020;
    lfo.connect(lg); lg.connect(g.gain);
    var lfo2 = A.ctx.createOscillator(); lfo2.type='sine'; lfo2.frequency.value=rand(0.4,0.9);
    var lg2 = A.ctx.createGain(); lg2.gain.value=140;
    lfo2.connect(lg2); lg2.connect(bp.frequency);
    s.connect(bp); bp.connect(lp); lp.connect(g); g.connect(A.master);
    s.start(t); lfo.start(t); lfo2.start(t);
    var obj = {s:s,bp:bp,lp:lp,g:g,lfo:lfo,lg:lg,lfo2:lfo2,lg2:lg2,dead:false};
    A.murmurs.push(obj);
    return obj;
  }catch(e){ return null; }
}
function murmurStop(m){
  if (!m || m.dead || !A.ready) return;
  m.dead = true;
  var t = now();
  try{
    m.g.gain.cancelScheduledValues(t);
    m.g.gain.setValueAtTime(max(m.g.gain.value,0.0002), t);
    m.g.gain.exponentialRampToValueAtTime(0.0001, t+0.12);
    m.s.stop(t+0.16); m.lfo.stop(t+0.16); m.lfo2.stop(t+0.16);
    m.s.onended = function(){
      try{ m.s.disconnect(); m.bp.disconnect(); m.lp.disconnect(); m.g.disconnect();
           m.lfo.disconnect(); m.lg.disconnect(); m.lfo2.disconnect(); m.lg2.disconnect(); }catch(e){}
    };
  }catch(e){}
  var i = A.murmurs.indexOf(m);
  if (i>=0) A.murmurs.splice(i,1);
}
function murmurStopAll(){
  for (var i=A.murmurs.length-1;i>=0;i--) murmurStop(A.murmurs[i]);
  A.murmurs.length = 0;
}
function setMuted(m){
  A.muted = m;
  if (A.master){
    try{
      var t = now();
      A.master.gain.cancelScheduledValues(t);
      A.master.gain.setTargetAtTime(m?0:0.25, t, 0.02);
    }catch(e){ A.master.gain.value = m?0:0.25; }
  }
}

/* ============================================================
   DATA
   ============================================================ */
var NAMES = [
  'MAPLE 3','OAK 7','ELM 12','CEDAR 4','BIRCH 9','WALNUT 2',
  'DEPOT','DOC HALE','RIVERSIDE 2','MILL 1','PARSONAGE','GRANGE 4',
  'FERRY 3','HOTEL LUNA','CREAMERY','SHERIFF','ORCHARD 9','LOCUST 6',
  'QUARRY 2','WIDOW BEAL','PINE 5','ASH 8','SCHOOLHOUSE','FEED STORE'
];
var CITIES = ['CHICAGO','ST. LOUIS','DETROIT','KANSAS CITY','DENVER','CINCINNATI','MEMPHIS','OMAHA','TOLEDO','DES MOINES'];

var CORD_COLORS = [
  {name:'oxblood', dark:'#4a1418', mid:'#7d2027', lite:'#a8434a'},
  {name:'navy',    dark:'#131f38', mid:'#263a63', lite:'#48628f'},
  {name:'forest',  dark:'#13261a', mid:'#254a30', lite:'#42704f'},
  {name:'mustard', dark:'#463008', mid:'#8a6216', lite:'#b98c31'},
  {name:'plum',    dark:'#2b1430', mid:'#4f2857', lite:'#77497f'},
  {name:'teal',    dark:'#0d2a2b', mid:'#1c4e50', lite:'#357476'}
];

var MERCY_RUN = 10;     // calls connected without a mis-plug that buy back one complaint
var NCORDS = 6;
var NJACK = 24;
var TRUNK = 24;          // jack index of the trunk
var SHIFT_LEN = 180;     // seconds

/* ============================================================
   LAYOUT
   ============================================================ */
var L = {
  topH:0, rackY:0, rackH:0,
  panel:{x:0,y:0,w:0,h:0},
  cols:6, rows:4,
  cellW:0, cellH:0, gridX:0, gridY:0,
  jr:14, lampR:7,
  jacks:[],       // {x,y,r,lampX,lampY,lampR,labX,labY,labW,labH,name,font}
  slots:[],       // per cord: {ax,ay,bx,by}
  mute:{x:0,y:0,r:0},
  tagAbove:true,
  small:false
};

function fitFont(text, maxW, startPx, minPx, weight){
  var px = startPx;
  bctx.save();
  while (px > minPx){
    bctx.font = (weight||'') + px.toFixed(1)+'px Georgia, serif';
    if (bctx.measureText(text).width <= maxW) break;
    px -= 0.5;
  }
  bctx.restore();
  return px;
}

function layout(){
  var pad = max(8, min(W,H)*0.022);
  L.small = W < 560;
  L.topH = clamp(H*0.085, 46, 68);
  L.rackH = clamp(H*0.155, 76, 128);
  L.rackY = H - L.rackH;

  var px = pad, pw = W - pad*2;
  var maxPW = 1180;
  if (pw > maxPW){ px = (W-maxPW)/2; pw = maxPW; }
  var py = L.topH + pad*0.6;
  var ph = L.rackY - py - pad*0.5;
  L.panel.x = px; L.panel.y = py; L.panel.w = pw; L.panel.h = ph;

  // trunk band at top of panel
  var trunkH = clamp(ph*0.16, 52, 84);
  var gx = px + pad*0.6, gw = pw - pad*1.2;
  var gy = py + trunkH, gh = ph - trunkH - pad*0.4;

  // choose grid shape
  var best=null;
  var opts = [[6,4],[4,6],[3,8],[8,3],[12,2]];
  for (var i=0;i<opts.length;i++){
    var c=opts[i][0], r=opts[i][1];
    if (c*r !== NJACK) continue;
    var cw=gw/c, chh=gh/r;
    if (cw < 46 || chh < 52) continue;
    var aspect = cw/chh;
    var score = abs(Math.log(aspect/1.18));
    if (!best || score < best.s) best = {c:c,r:r,s:score};
  }
  if (!best) best = (gw/gh > 1) ? {c:6,r:4} : {c:4,r:6};
  L.cols = best.c; L.rows = best.r;
  L.cellW = gw/L.cols; L.cellH = gh/L.rows;
  L.gridX = gx; L.gridY = gy;

  L.jr = clamp(min(L.cellW, L.cellH)*0.21, 10, 24);
  L.lampR = clamp(L.jr*0.44, 5, 11);

  L.jacks.length = 0;
  for (var k=0;k<NJACK;k++){
    var cx = gx + (k%L.cols + 0.5)*L.cellW;
    var row = floor(k/L.cols);
    var cy0 = gy + row*L.cellH;
    var j = {
      name: NAMES[k], kind:'sub',
      lampX: cx, lampY: cy0 + L.cellH*0.29,
      x: cx,      y: cy0 + L.cellH*0.60,
      r: L.jr,
      lampR: L.lampR,
      labW: min(L.cellW*0.9, 132), labH: clamp(L.cellH*0.18, 12, 22),
      labX: cx, labY: cy0 + L.cellH*0.90,
      font: 10, cellY: cy0
    };
    j.font = fitFont(j.name, j.labW-8, clamp(j.labH*0.62, 8, 13.5), 6.5, '');
    L.jacks.push(j);
  }
  // do request tags fit in the band above each lamp, or must they sit on the name plate?
  (function(){
    var j0 = L.jacks[0];
    var tagH = clamp(L.jr*1.05, 15, 20);
    var prevLabelBottom = -L.cellH*0.10 + (j0.labH*0.5);
    var tagBottom = L.cellH*0.29 - L.lampR*1.8 - 3;
    L.tagAbove = (tagBottom - tagH) >= (prevLabelBottom + 2);
  })();

  // trunk jack (index 24)
  var tr = min(clamp(L.jr*1.32, 13, 30), trunkH*0.25);
  var tlr = min(L.lampR*1.15, trunkH*0.11);
  var tj = {
    name:'TRUNK', kind:'trunk',
    x: px + pw*0.5, y: py + trunkH*0.56, r: tr,
    lampX: px + pw*0.5, lampY: py + trunkH*0.17,
    lampR: tlr,
    labW: min(pw*0.5, 220), labH: min(clamp(trunkH*0.2,12,18), trunkH*0.19),
    labX: px + pw*0.5, labY: py + trunkH*0.90,
    font: 10, cellY: py
  };
  tj.font = fitFont('LONG DISTANCE', tj.labW-10, 11, 7, '');
  L.jacks.push(tj);

  // cord rack slots
  var rackInner = pw;
  var slotW = rackInner / NCORDS;
  var postGap = min(slotW*0.34, 44);
  var postY = L.rackY + L.rackH*0.30;
  L.slots.length = 0;
  for (var c2=0;c2<NCORDS;c2++){
    var scx = px + (c2+0.5)*slotW;
    L.slots.push({ ax: scx - postGap/2, ay: postY, bx: scx + postGap/2, by: postY, cx: scx });
  }

  // mute button
  var mr = clamp(min(W,H)*0.026, 11, 16);
  L.mute.r = mr;
  L.mute.x = W - max(pad, mr+10) - mr*0.2;
  L.mute.y = L.topH*0.5;
}

/* ============================================================
   STATIC BOARD PRE-RENDER
   ============================================================ */
function roundRect(c, x, y, w, h, r){
  r = min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

function woodGrain(c, x, y, w, h, seed, alpha){
  c.save();
  c.beginPath(); c.rect(x,y,w,h); c.clip();
  c.globalAlpha = alpha;
  var s = seed;
  function rnd(){ s = (s*1664525+1013904223)>>>0; return s/4294967296; }
  c.lineWidth = 1;
  var lines = floor(h/3)+8;
  for (var i=0;i<lines;i++){
    var yy = y + rnd()*h;
    var amp = 1.5 + rnd()*5;
    var ph = rnd()*TAU;
    c.strokeStyle = rnd()>0.5 ? 'rgba(0,0,0,0.5)' : 'rgba(190,140,88,0.24)';
    c.beginPath();
    for (var xx=x; xx<=x+w; xx+=14){
      var yv = yy + sin((xx*0.011)+ph)*amp + sin(xx*0.037+ph*2)*amp*0.3;
      if (xx===x) c.moveTo(xx,yv); else c.lineTo(xx,yv);
    }
    c.stroke();
  }
  c.restore();
}

function drawJackBezel(c, j, gold){
  var r = j.r;
  // recessed shadow ring
  var g0 = c.createRadialGradient(j.x, j.y+r*0.25, r*0.2, j.x, j.y, r*1.55);
  g0.addColorStop(0,'rgba(0,0,0,0.55)');
  g0.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle = g0;
  c.beginPath(); c.arc(j.x, j.y, r*1.55, 0, TAU); c.fill();

  // brass ring
  var g1 = c.createLinearGradient(j.x-r, j.y-r, j.x+r*0.8, j.y+r*1.1);
  if (gold){
    g1.addColorStop(0,'#ffe9a8'); g1.addColorStop(.34,'#e0b45c');
    g1.addColorStop(.62,'#a97a2c'); g1.addColorStop(1,'#f0d18a');
  }else{
    g1.addColorStop(0,'#e8d3a4'); g1.addColorStop(.3,'#c2a06a');
    g1.addColorStop(.62,'#7f6435'); g1.addColorStop(1,'#d6bd8b');
  }
  c.fillStyle = g1;
  c.beginPath(); c.arc(j.x, j.y, r, 0, TAU); c.fill();

  // inner bevel
  c.lineWidth = max(1, r*0.10);
  c.strokeStyle = 'rgba(255,240,205,0.42)';
  c.beginPath(); c.arc(j.x, j.y, r*0.94, PI*1.05, PI*1.95); c.stroke();
  c.strokeStyle = 'rgba(60,38,12,0.5)';
  c.beginPath(); c.arc(j.x, j.y, r*0.94, PI*0.06, PI*0.94); c.stroke();

  // hole
  var hr = r*0.55;
  var g2 = c.createRadialGradient(j.x, j.y-hr*0.3, hr*0.1, j.x, j.y, hr);
  g2.addColorStop(0,'#0b0704');
  g2.addColorStop(.72,'#080503');
  g2.addColorStop(1,'#1a120a');
  c.fillStyle = g2;
  c.beginPath(); c.arc(j.x, j.y, hr, 0, TAU); c.fill();
  c.strokeStyle='rgba(0,0,0,0.7)'; c.lineWidth=max(1,r*0.07);
  c.beginPath(); c.arc(j.x, j.y, hr, 0, TAU); c.stroke();
  // tiny highlight in hole
  c.fillStyle='rgba(210,180,130,0.18)';
  c.beginPath(); c.ellipse(j.x, j.y+hr*0.45, hr*0.5, hr*0.22, 0, 0, TAU); c.fill();
}

function drawLampSocket(c, x, y, r){
  var g = c.createRadialGradient(x, y-r*0.3, r*0.15, x, y, r*1.5);
  g.addColorStop(0,'rgba(0,0,0,0.5)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=g; c.beginPath(); c.arc(x,y,r*1.5,0,TAU); c.fill();
  var g2 = c.createLinearGradient(x-r,y-r,x+r,y+r);
  g2.addColorStop(0,'#c9b083'); g2.addColorStop(.5,'#8a7245'); g2.addColorStop(1,'#bda173');
  c.fillStyle = g2;
  c.beginPath(); c.arc(x,y,r*1.18,0,TAU); c.fill();
  var g3 = c.createRadialGradient(x, y-r*0.35, r*0.1, x, y, r);
  g3.addColorStop(0,'#4a4038'); g3.addColorStop(1,'#231c16');
  c.fillStyle=g3; c.beginPath(); c.arc(x,y,r,0,TAU); c.fill();
}

function drawLabelPlate(c, j){
  var w=j.labW, h=j.labH, x=j.labX-w/2, y=j.labY-h/2;
  c.save();
  c.shadowColor='rgba(0,0,0,0.55)'; c.shadowBlur=4; c.shadowOffsetY=1.5;
  var g = c.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,'#efe4cd'); g.addColorStop(0.55,'#e3d5b8'); g.addColorStop(1,'#cfbe9c');
  c.fillStyle=g;
  roundRect(c,x,y,w,h,min(3,h*0.28)); c.fill();
  c.restore();
  c.strokeStyle='rgba(90,68,38,0.42)'; c.lineWidth=1;
  roundRect(c,x+0.5,y+0.5,w-1,h-1,min(3,h*0.28)); c.stroke();
  c.fillStyle='#33241a';
  c.font = j.font.toFixed(1)+'px Georgia, serif';
  c.textAlign='center'; c.textBaseline='middle';
  c.fillText(j.name, j.labX, j.labY+0.5);
}

function renderBoard(){
  board.width = max(1,floor(W*DPR)); board.height = max(1,floor(H*DPR));
  bctx.setTransform(DPR,0,0,DPR,0,0);
  bctx.clearRect(0,0,W,H);

  // ---- backdrop wall ----
  var bg = bctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1a0f0a'); bg.addColorStop(0.5,'#130b07'); bg.addColorStop(1,'#0c0705');
  bctx.fillStyle=bg; bctx.fillRect(0,0,W,H);

  // ---- top rail ----
  var tg = bctx.createLinearGradient(0,0,0,L.topH);
  tg.addColorStop(0,'#332014'); tg.addColorStop(0.6,'#241509'); tg.addColorStop(1,'#180e07');
  bctx.fillStyle=tg; bctx.fillRect(0,0,W,L.topH);
  woodGrain(bctx,0,0,W,L.topH, 7717, 0.28);
  bctx.fillStyle='rgba(214,176,110,0.28)';
  bctx.fillRect(0,L.topH-1,W,1);

  // ---- main panel ----
  var p=L.panel;
  bctx.save();
  bctx.shadowColor='rgba(0,0,0,0.75)'; bctx.shadowBlur=26; bctx.shadowOffsetY=8;
  var pg = bctx.createLinearGradient(p.x,p.y,p.x+p.w*0.2,p.y+p.h);
  pg.addColorStop(0,'#4a2c1c'); pg.addColorStop(0.45,'#37200f'); pg.addColorStop(1,'#2a1809');
  bctx.fillStyle=pg;
  roundRect(bctx,p.x,p.y,p.w,p.h,6); bctx.fill();
  bctx.restore();
  woodGrain(bctx,p.x,p.y,p.w,p.h, 20219, 0.34);

  // panel inner darkening + frame
  var vg = bctx.createRadialGradient(p.x+p.w*0.5, p.y+p.h*0.42, min(p.w,p.h)*0.25, p.x+p.w*0.5, p.y+p.h*0.5, max(p.w,p.h)*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.5)');
  bctx.fillStyle=vg; roundRect(bctx,p.x,p.y,p.w,p.h,6); bctx.fill();

  bctx.lineWidth=2; bctx.strokeStyle='rgba(220,182,116,0.30)';
  roundRect(bctx,p.x+1,p.y+1,p.w-2,p.h-2,6); bctx.stroke();
  bctx.lineWidth=1; bctx.strokeStyle='rgba(0,0,0,0.55)';
  roundRect(bctx,p.x+3.5,p.y+3.5,p.w-7,p.h-7,4); bctx.stroke();

  // ---- trunk band ----
  var tj = L.jacks[TRUNK];
  var bandY = p.y+5, bandH = tj.labY + tj.labH*0.5 + 6 - bandY;
  var bandG = bctx.createLinearGradient(0,bandY,0,bandY+bandH);
  bandG.addColorStop(0,'rgba(255,220,150,0.055)'); bandG.addColorStop(1,'rgba(0,0,0,0.16)');
  bctx.fillStyle=bandG;
  roundRect(bctx,p.x+5,bandY,p.w-10,bandH,4); bctx.fill();
  bctx.strokeStyle='rgba(226,186,110,0.16)'; bctx.lineWidth=1;
  roundRect(bctx,p.x+5.5,bandY+0.5,p.w-11,bandH-1,4); bctx.stroke();

  // engraved side text on trunk band
  bctx.save();
  bctx.font = clamp(L.small?7.5:9,7,10).toFixed(1)+'px Georgia, serif';
  bctx.textAlign='left'; bctx.textBaseline='middle';
  bctx.fillStyle='rgba(226,190,124,0.34)';
  var lt = 'NIGHT EXCHANGE No. 4';
  bctx.fillText(lt, p.x+16, bandY+bandH*0.42);
  bctx.textAlign='right';
  bctx.fillText('MUNICIPAL TEL. CO.', p.x+p.w-16, bandY+bandH*0.42);
  bctx.restore();

  drawLampSocket(bctx, tj.lampX, tj.lampY, tj.lampR);
  drawJackBezel(bctx, tj, true);
  // trunk label plate (gold-tinted)
  var w=tj.labW,h=tj.labH,x=tj.labX-w/2,y=tj.labY-h/2;
  bctx.save();
  bctx.shadowColor='rgba(0,0,0,0.6)'; bctx.shadowBlur=5; bctx.shadowOffsetY=1.5;
  var g=bctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,'#f4e2b0'); g.addColorStop(1,'#d8bd82');
  bctx.fillStyle=g; roundRect(bctx,x,y,w,h,2.5); bctx.fill();
  bctx.restore();
  bctx.strokeStyle='rgba(110,80,32,0.5)'; bctx.lineWidth=1;
  roundRect(bctx,x+0.5,y+0.5,w-1,h-1,2.5); bctx.stroke();
  bctx.fillStyle='#3a2610';
  bctx.font = tj.font.toFixed(1)+'px Georgia, serif';
  bctx.textAlign='center'; bctx.textBaseline='middle';
  bctx.fillText('LONG DISTANCE', tj.labX, tj.labY+0.5);

  // ---- subscriber jacks ----
  for (var i=0;i<NJACK;i++){
    var j = L.jacks[i];
    drawLampSocket(bctx, j.lampX, j.lampY, L.lampR);
    drawJackBezel(bctx, j, false);
    drawLabelPlate(bctx, j);
  }

  // faint row separators
  bctx.strokeStyle='rgba(0,0,0,0.3)'; bctx.lineWidth=1;
  for (var rI=1;rI<L.rows;rI++){
    var yy = L.gridY + rI*L.cellH;
    bctx.beginPath(); bctx.moveTo(L.gridX+8, yy); bctx.lineTo(L.gridX+L.cols*L.cellW-8, yy); bctx.stroke();
  }
  bctx.strokeStyle='rgba(220,180,120,0.06)';
  for (var rI2=1;rI2<L.rows;rI2++){
    var yy2 = L.gridY + rI2*L.cellH + 1;
    bctx.beginPath(); bctx.moveTo(L.gridX+8, yy2); bctx.lineTo(L.gridX+L.cols*L.cellW-8, yy2); bctx.stroke();
  }

  // ---- cord rack shelf ----
  var rg = bctx.createLinearGradient(0,L.rackY-6,0,H);
  rg.addColorStop(0,'#3a2415'); rg.addColorStop(0.16,'#1d1209'); rg.addColorStop(1,'#0d0805');
  bctx.fillStyle=rg; bctx.fillRect(0,L.rackY-6,W,H-L.rackY+6);
  woodGrain(bctx,0,L.rackY-6,W,H-L.rackY+6, 5501, 0.22);
  bctx.fillStyle='rgba(226,186,110,0.24)'; bctx.fillRect(0,L.rackY-6,W,1.5);
  bctx.fillStyle='rgba(0,0,0,0.42)'; bctx.fillRect(0,L.rackY-4.5,W,3);

  for (var s=0;s<NCORDS;s++){
    var sl = L.slots[s];
    // shelf recess
    var rw = min(L.panel.w/NCORDS*0.86, 150);
    bctx.fillStyle='rgba(0,0,0,0.3)';
    roundRect(bctx, sl.cx-rw/2, L.rackY+4, rw, L.rackH-10, 4); bctx.fill();
    bctx.strokeStyle='rgba(226,186,110,0.09)'; bctx.lineWidth=1;
    roundRect(bctx, sl.cx-rw/2+0.5, L.rackY+4.5, rw-1, L.rackH-11, 4); bctx.stroke();
    // two rest posts
    for (var e=0;e<2;e++){
      var pxp = e?sl.bx:sl.ax, pyp = e?sl.by:sl.ay;
      bctx.fillStyle='rgba(0,0,0,0.5)';
      bctx.beginPath(); bctx.ellipse(pxp, pyp+3, 7, 3.2, 0,0,TAU); bctx.fill();
      var pg2 = bctx.createLinearGradient(pxp-6,pyp-6,pxp+6,pyp+6);
      pg2.addColorStop(0,'#a98b56'); pg2.addColorStop(.5,'#6d5730'); pg2.addColorStop(1,'#8f7645');
      bctx.fillStyle=pg2;
      bctx.beginPath(); bctx.arc(pxp,pyp,5.4,0,TAU); bctx.fill();
      bctx.fillStyle='rgba(20,12,6,0.85)';
      bctx.beginPath(); bctx.arc(pxp,pyp,2.6,0,TAU); bctx.fill();
    }
  }

  // vignette cache
  vignette = ctx.createRadialGradient(W*0.5,H*0.46, min(W,H)*0.28, W*0.5,H*0.5, max(W,H)*0.78);
  vignette.addColorStop(0,'rgba(0,0,0,0)');
  vignette.addColorStop(0.62,'rgba(0,0,0,0.24)');
  vignette.addColorStop(1,'rgba(0,0,0,0.72)');
}

/* ============================================================
   CORDS — verlet rope physics
   ============================================================ */
var SEG = 22;                 // points per cord
var PHYS_DT = 1/60;
var cords = [];

function makeCord(i){
  var c = {
    id:i,
    col: CORD_COLORS[i%CORD_COLORS.length],
    n: SEG,
    px: new Float32Array(SEG), py: new Float32Array(SEG),
    ox: new Float32Array(SEG), oy: new Float32Array(SEG),
    ends: [
      {mode:'rack', jack:-1, x:0, y:0, tx:0, ty:0, seatT:0},
      {mode:'rack', jack:-1, x:0, y:0, tx:0, ty:0, seatT:0}
    ],
    grab:-1, grabX:0, grabY:0,
    total: 120, targetTotal: 120,
    call:null, retract:0,
    spark:0, hot:0
  };
  return c;
}
function initCords(){
  cords.length = 0;
  for (var i=0;i<NCORDS;i++) cords.push(makeCord(i));
  resetCordsToRack();
}
function resetCordsToRack(){
  for (var i=0;i<NCORDS;i++){
    var c = cords[i], sl = L.slots[i];
    c.ends[0].mode='rack'; c.ends[0].jack=-1; c.ends[0].x=sl.ax; c.ends[0].y=sl.ay;
    c.ends[1].mode='rack'; c.ends[1].jack=-1; c.ends[1].x=sl.bx; c.ends[1].y=sl.by;
    c.grab=-1; c.call=null; c.retract=0; c.spark=0; c.hot=0;
    var dx=(sl.bx-sl.ax), dy=(sl.by-sl.ay);
    c.total = Math.hypot(dx,dy)*1.2 + 46;
    c.targetTotal = c.total;
    // drape initial shape as a hanging arc
    for (var k=0;k<SEG;k++){
      var t = k/(SEG-1);
      var x = sl.ax + dx*t;
      var y = sl.ay + dy*t + sin(t*PI)*min(L.rackH*0.42, 34);
      c.px[k]=x; c.py[k]=y; c.ox[k]=x; c.oy[k]=y;
    }
  }
}

function endTarget(c, ei){
  var e = c.ends[ei];
  if (e.mode==='hand'){ return {x:drag.x, y:drag.y}; }
  if (e.mode==='jack'){
    var j = L.jacks[e.jack];
    if (j) return {x:j.x, y:j.y + j.r*0.10};
    return {x:e.x, y:e.y};
  }
  var sl = L.slots[c.id];
  return ei===0 ? {x:sl.ax, y:sl.ay} : {x:sl.bx, y:sl.by};
}

function cordEndPos(c, ei){
  var i = ei===0?0:SEG-1;
  return {x:c.px[i], y:c.py[i]};
}

function cordPhys(c){
  // --- endpoint pins ---
  for (var ei=0; ei<2; ei++){
    var e = c.ends[ei];
    var t = endTarget(c, ei);
    if (e.mode==='ease'){
      e.x = lerp(e.x, t.x, 0.20);
      e.y = lerp(e.y, t.y, 0.20);
      if (abs(e.x-t.x)<1.2 && abs(e.y-t.y)<1.2){ e.mode='rack'; e.x=t.x; e.y=t.y; }
    } else {
      e.x = t.x; e.y = t.y;
    }
  }
  // --- desired slack ---
  var ax=c.ends[0].x, ay=c.ends[0].y, bx=c.ends[1].x, by=c.ends[1].y;
  var d = Math.hypot(bx-ax, by-ay);
  var slackBase = (c.ends[0].mode==='rack'&&c.ends[1].mode==='rack') ? 42 : 62;
  var want = d*1.10 + slackBase;
  var maxLen = Math.hypot(W,H)*1.15;
  want = clamp(want, 90, maxLen);
  c.targetTotal = want;
  c.total += (c.targetTotal - c.total) * 0.10;
  if (c.total < d + 2) c.total = d + 2;
  var segLen = c.total/(SEG-1);

  // --- verlet integrate ---
  var g = 1500 * PHYS_DT * PHYS_DT;
  var damp = 0.982;
  var maxStep = 26;
  for (var i=1;i<SEG-1;i++){
    if (i===c.grab) continue;
    var vx = (c.px[i]-c.ox[i])*damp;
    var vy = (c.py[i]-c.oy[i])*damp;
    if (vx>maxStep) vx=maxStep; else if (vx<-maxStep) vx=-maxStep;
    if (vy>maxStep) vy=maxStep; else if (vy<-maxStep) vy=-maxStep;
    c.ox[i]=c.px[i]; c.oy[i]=c.py[i];
    c.px[i]+=vx; c.py[i]+=vy+g;
  }
  // pinned points
  c.px[0]=ax; c.py[0]=ay; c.ox[0]=ax; c.oy[0]=ay;
  c.px[SEG-1]=bx; c.py[SEG-1]=by; c.ox[SEG-1]=bx; c.oy[SEG-1]=by;
  if (c.grab>0 && c.grab<SEG-1){
    c.px[c.grab]=c.grabX; c.py[c.grab]=c.grabY;
    c.ox[c.grab]=c.grabX; c.oy[c.grab]=c.grabY;
  }
  // --- constraints ---
  for (var it=0; it<3; it++){
    for (var k=0;k<SEG-1;k++){
      var dx = c.px[k+1]-c.px[k], dy = c.py[k+1]-c.py[k];
      var dist = Math.hypot(dx,dy);
      if (dist < 0.0001) { dx = 0.01; dy = 0; dist = 0.01; }
      var diff = (dist - segLen)/dist * 0.5;
      var ox2 = dx*diff, oy2 = dy*diff;
      var k0Free = (k!==0 && k!==SEG-1 && k!==c.grab);
      var k1Free = (k+1!==0 && k+1!==SEG-1 && k+1!==c.grab);
      if (k0Free && k1Free){
        c.px[k]+=ox2; c.py[k]+=oy2; c.px[k+1]-=ox2; c.py[k+1]-=oy2;
      } else if (k0Free){
        c.px[k]+=ox2*2; c.py[k]+=oy2*2;
      } else if (k1Free){
        c.px[k+1]-=ox2*2; c.py[k+1]-=oy2*2;
      }
    }
    // keep out of the very bottom / sides
    for (var m=1;m<SEG-1;m++){
      if (m===c.grab) continue;
      if (c.py[m] > H-3) c.py[m] = H-3;
      if (c.px[m] < -40) c.px[m] = -40;
      if (c.px[m] > W+40) c.px[m] = W+40;
    }
  }
  // sanity: NaN guard
  if (!isFinite(c.px[1]) || !isFinite(c.py[1])){
    for (var q=0;q<SEG;q++){
      var tq=q/(SEG-1);
      c.px[q]=lerp(ax,bx,tq); c.py[q]=lerp(ay,by,tq)+sin(tq*PI)*30;
      c.ox[q]=c.px[q]; c.oy[q]=c.py[q];
    }
  }
}

function cordBump(c, amt){
  for (var i=1;i<SEG-1;i++){
    c.ox[i] -= rand(-amt,amt);
    c.oy[i] -= rand(-amt*0.6,amt*0.6);
  }
}
function bumpAll(amt){
  for (var i=0;i<NCORDS;i++) cordBump(cords[i], amt);
}

function cordIsIdle(c){
  return c.ends[0].mode!=='jack' && c.ends[1].mode!=='jack' &&
         c.ends[0].mode!=='hand' && c.ends[1].mode!=='hand' && !c.call;
}
function freeCord(){
  for (var i=0;i<NCORDS;i++) if (cordIsIdle(cords[i])) return cords[i];
  return null;
}
function cordOther(c, ei){ return ei===0?1:0; }

/* ============================================================
   GAME STATE
   ============================================================ */
var G = {
  state:'start',       // start | play | paused | win | lose
  t:0,                 // shift seconds elapsed
  score:0, connected:0, streak:0, bestStreak:0, complaints:0,
  spawnTimer:2.2,
  calls:[],
  shake:0, shakeT:0,
  flash:0,
  jackFlash:new Float32Array(NJACK+1),
  particles:[],
  floats:[],
  toast:'', toastT:0,
  goodRun:0,
  pipClearT:0, pipClearIdx:-1,
  prog:0,
  ldUnlocked:false
};
var plugAt = new Int8Array(NJACK+1);  // cordId+1 occupying each jack (0 = free)

function jackFree(idx){ return plugAt[idx]===0; }
function jackBusy(idx){
  for (var i=0;i<G.calls.length;i++){
    var cl=G.calls[i];
    if (cl.state==='talk'||cl.state==='dial'){
      if (cl.from===idx || cl.to===idx) return true;
    }
  }
  return false;
}
function callRingingAt(idx){
  for (var i=0;i<G.calls.length;i++){
    if (G.calls[i].state==='ring' && G.calls[i].from===idx) return G.calls[i];
  }
  return null;
}
function seatPlug(c, ei, jackIdx){
  var e = c.ends[ei];
  if (e.mode==='jack' && e.jack>=0){ plugAt[e.jack]=0; }
  e.mode='jack'; e.jack=jackIdx; e.seatT=0.001;
  plugAt[jackIdx]=c.id+1;
  var j = L.jacks[jackIdx];
  e.x=j.x; e.y=j.y;
}
function unseatPlug(c, ei, toRack){
  var e = c.ends[ei];
  if (e.mode==='jack' && e.jack>=0){ plugAt[e.jack]=0; }
  e.jack=-1;
  e.mode = toRack ? 'ease' : 'hand';
}
function releaseCord(c, animate){
  if (c.call){ c.call.cord=null; c.call=null; }
  for (var ei=0; ei<2; ei++){
    var e=c.ends[ei];
    if (e.mode==='jack' && e.jack>=0){ plugAt[e.jack]=0; }
    e.jack=-1;
    e.mode = animate?'ease':'rack';
  }
  c.grab=-1; c.hot=0; c.spark=0;
}

/* ---------------- particles ---------------- */
function addParticle(x,y,vx,vy,life,size,col,kind,grav){
  if (G.particles.length>260) return;
  G.particles.push({x:x,y:y,vx:vx,vy:vy,life:life,max:life,size:size,col:col,kind:kind||0,g:grav===undefined?520:grav});
}
function sparkBurst(x,y,n){
  for (var i=0;i<n;i++){
    var a = rand(0,TAU), s = rand(40,230);
    addParticle(x,y,cos(a)*s, sin(a)*s - 40, rand(0.16,0.42), rand(1,2.4), 0, 0, 620);
  }
  addParticle(x,y,0,0,0.22,rand(12,18),0,2,0);
}
function dustBurst(x,y){
  for (var i=0;i<7;i++){
    var a = rand(-PI*0.85,-PI*0.15), s=rand(18,64);
    addParticle(x,y,cos(a)*s,sin(a)*s,rand(0.35,0.75),rand(0.8,1.8),1,1,-30);
  }
  addParticle(x,y,0,0,0.28,rand(9,14),1,2,0);
}
function addFloat(x,y,text,col){
  // floats rise ~26px; keep them out of the trunk band so they never sit on its label
  var minY = L.gridY + 34;
  G.floats.push({x:clamp(x, 60, W-60), y:max(y, minY), t:0, life:1.1, text:text, col:col||'#f0d79c'});
}
function toast(msg){ G.toast=msg; G.toastT=1.7; }
function shake(a){ G.shake = max(G.shake, a); G.shakeT = 0.34; bumpAll(a*0.5); }

/* ============================================================
   CALLS
   ============================================================ */
function difficulty(){
  return clamp(G.t / SHIFT_LEN, 0, 1);
}
function spawnInterval(){
  var p = G.prog;
  return lerp(3.6, 2.35, p) * rand(0.84, 1.20);
}
function maxConcurrent(){
  return 2 + floor(G.prog*1.4);   // 2 .. 3 ringing at once
}
function patienceFor(){
  return lerp(12.5, 10.0, G.prog);
}

function idleJacks(){
  var out=[];
  for (var i=0;i<NJACK;i++){
    if (plugAt[i]!==0) continue;
    if (jackBusy(i)) continue;
    var ringing=false;
    for (var k=0;k<G.calls.length;k++){
      var cl=G.calls[k];
      if (cl.from===i || cl.to===i){ ringing=true; break; }
    }
    if (!ringing) out.push(i);
  }
  return out;
}

function spawnCall(){
  var pool = idleJacks();
  if (pool.length < 3) return false;
  var from = pick(pool);
  var ldChance = G.ldUnlocked ? clamp((G.t-58)/95, 0, 1)*0.34 : 0;
  var ld = (Math.random() < ldChance);
  if (ld && (plugAt[TRUNK]!==0 || jackBusy(TRUNK)) && Math.random() < 0.72) ld = false;
  var to, city='';
  if (ld){
    to = TRUNK;
    city = pick(CITIES);
  } else {
    // candidate targets
    var cand = [];
    for (var i=0;i<pool.length;i++) if (pool[i]!==from) cand.push(pool[i]);
    // occasionally target someone already busy (rare early)
    var busyChance = clamp((G.t-70)/110,0,1)*0.16;
    if (Math.random() < busyChance){
      var busyList=[];
      for (var b=0;b<NJACK;b++) if (b!==from && jackBusy(b)) busyList.push(b);
      if (busyList.length) cand = busyList;
    }
    if (!cand.length) return false;
    to = pick(cand);
  }
  var pat = patienceFor() * (ld?1.16:1);
  G.calls.push({
    from:from, to:to, ld:ld, city:city,
    state:'ring', patience:pat, patMax:pat, sat:1,
    ringT:0, answered:false,
    dialT:0, dialClick:0,
    talkT:0, talkDur:0,
    cord:null, murmur:null, strained:false,
    lampPhase: Math.random()*TAU,
    connT:0, born:G.t
  });
  sndRing();
  return true;
}

function startTalk(cl){
  cl.state='talk';
  cl.talkDur = (cl.ld ? rand(6.4,9.8) : rand(4.9,8.6)) - G.prog*1.5;
  cl.talkT = cl.talkDur;
  cl.murmur = murmurStart();
}

function connectCall(cl, cord, ei){
  cl.cord = cord; cord.call = cl;
  cl.connT = 0;
  var base = cl.ld ? 250 : 100;
  var bonusHalf = (cl.patience/cl.patMax > 0.5);
  var mult = 1 + min(G.streak,10)*0.1;
  var pts = floor((base + (bonusHalf?40:0)) * mult);
  G.score += pts;
  G.connected++;
  G.streak++;
  if (G.streak > G.bestStreak) G.bestStreak = G.streak;
  G.goodRun++;
  var mercy = false;
  if (G.goodRun >= MERCY_RUN && G.complaints > 0){ G.goodRun -= MERCY_RUN; mercy = true; }
  else if (G.goodRun > MERCY_RUN*2){ G.goodRun = MERCY_RUN*2; }   // bank at most two nights' goodwill
  var jf = L.jacks[cl.from], jt = L.jacks[cl.to];
  addFloat((jf.x+jt.x)/2, (jf.y+jt.y)/2 - 14, '+'+pts, cl.ld?'#ffd98a':'#f0e2bd');
  if (bonusHalf) addFloat((jf.x+jt.x)/2, (jf.y+jt.y)/2 + 4, 'PROMPT', 'rgba(180,225,180,.85)');
  dustBurst(jf.x, jf.y); dustBurst(jt.x, jt.y);
  sndChunk();
  G.jackFlash[cl.from] = 1; G.jackFlash[cl.to] = 1;
  if (mercy){
    G.complaints--;
    G.pipClearIdx = G.complaints;
    G.pipClearT = 1;
    sndMercy();
    addFloat(jf.x, jf.y - clamp(L.jr*1.5, 22, 38), 'COMPLAINT WITHDRAWN', 'rgba(163,216,150,0.96)');
    for (var mp=0; mp<10; mp++){
      var ma = rand(0,TAU), ms = rand(20,70);
      addParticle(L.mute.x - L.mute.r*3, L.topH*0.5, cos(ma)*ms, sin(ma)*ms, rand(0.4,0.8), rand(1,2.2), 1, 0, -40);
    }
  }
  if (cl.ld){ cl.state='dial'; cl.dialT=2.0; cl.dialClick=0; }
  else startTalk(cl);
}

function endCall(cl, kind){
  // kind: 'done' | 'hangup' | 'crosstalk'
  murmurStop(cl.murmur); cl.murmur=null;
  if (cl.cord) releaseCord(cl.cord, true);
  cl.cord = null;
  if (kind==='done'){
    sndEndCall();
  } else {
    G.complaints++;
    G.streak = 0;
    G.spawnTimer = max(G.spawnTimer, 2.2);   // a moment to catch up
    sndHangup();
    G.jackFlash[cl.from] = -1;
    G.flash = max(G.flash, 0.5);
    shake(4);
    addFloat(L.jacks[cl.from].x, L.jacks[cl.from].y-18, kind==='crosstalk'?'CUT OFF':'HUNG UP', '#e2705f');
  }
  var i = G.calls.indexOf(cl);
  if (i>=0) G.calls.splice(i,1);
}

function tryConnect(c, ei){
  var e0=c.ends[0], e1=c.ends[1];
  if (e0.mode!=='jack' || e1.mode!=='jack') return;
  var a=e0.jack, b=e1.jack;
  if (a===b) return;
  for (var i=0;i<G.calls.length;i++){
    var cl=G.calls[i];
    if (cl.state!=='ring') continue;
    if ((cl.from===a && cl.to===b) || (cl.from===b && cl.to===a)){
      connectCall(cl, c, ei);
      return;
    }
  }
  // wrong pairing
  wrongPlug(c, ei, a, b);
}

function wrongPlug(c, ei, a, b){
  sndErr();
  shake(6);
  G.flash = max(G.flash, 0.62);
  G.jackFlash[c.ends[ei].jack] = -1;
  G.streak = 0;
  G.goodRun = 0;
  var cl = callRingingAt(a) || callRingingAt(b);
  if (cl){ cl.patience = max(0.35, cl.patience - 2.0); }
  addFloat(L.jacks[c.ends[ei].jack].x, L.jacks[c.ends[ei].jack].y - 16, 'WRONG PARTY', '#e2705f');
  // pop the newly plugged end back out
  unseatPlug(c, ei, true);
  if (c.ends[0].mode!=='jack' && c.ends[1].mode!=='jack'){
    releaseCord(c, true);
  }
}

/* ---------------- crosstalk ---------------- */
var ctTimer = new Float32Array(NCORDS*NCORDS);
var sparkCd = 0;

function cordActive(c){ return !!(c.call && (c.call.state==='talk' || c.call.state==='dial')); }

function segSegDist2(ax,ay,bx,by,cx,cy,dx,dy,out){
  var ux=bx-ax, uy=by-ay, vx=dx-cx, vy=dy-cy, wx=ax-cx, wy=ay-cy;
  var a=ux*ux+uy*uy, b=ux*vx+uy*vy, c=vx*vx+vy*vy, d=ux*wx+uy*wy, e=vx*wx+vy*wy;
  var D=a*c-b*b, sc, sN, sD=D, tc, tN, tD=D;
  if (D < 1e-9){ sN=0; sD=1; tN=e; tD=c; }
  else {
    sN = b*e-c*d; tN = a*e-b*d;
    if (sN < 0){ sN=0; tN=e; tD=c; }
    else if (sN > sD){ sN=sD; tN=e+b; tD=c; }
  }
  if (tN < 0){
    tN = 0;
    if (-d < 0) sN = 0; else if (-d > a) sN = sD; else { sN = -d; sD = a; }
  } else if (tN > tD){
    tN = tD;
    if ((-d+b) < 0) sN = 0; else if ((-d+b) > a) sN = sD; else { sN = -d+b; sD = a; }
  }
  sc = (abs(sD) < 1e-9) ? 0 : sN/sD;
  tc = (abs(tD) < 1e-9) ? 0 : tN/tD;
  var px = ax + sc*ux, py = ay + sc*uy;
  var qx = cx + tc*vx, qy = cy + tc*vy;
  if (out){ out.x = (px+qx)*0.5; out.y = (py+qy)*0.5; }
  var ex = px-qx, ey = py-qy;
  return ex*ex + ey*ey;
}

var ctPt = {x:0, y:0};
var ctPts = [];
for (var _q=0; _q<16; _q++) ctPts.push({x:0,y:0});
var ctCount = 0;

function updateCrosstalk(dt){
  ctCount = 0;
  for (var i=0;i<NCORDS;i++) cords[i].hot = max(0, cords[i].hot - dt*3);
  for (var s0=0;s0<G.calls.length;s0++) G.calls[s0].strained = false;
  sparkCd -= dt;
  var thresh = clamp(L.jr*0.42, 7, 11);
  var t2 = thresh*thresh;
  for (var a=0;a<NCORDS;a++){
    var ca = cords[a];
    if (!cordActive(ca)) { for (var z=0;z<NCORDS;z++){ ctTimer[a*NCORDS+z]=0; ctTimer[z*NCORDS+a]=0; } continue; }
    for (var b=a+1;b<NCORDS;b++){
      var cb = cords[b];
      var idx = a*NCORDS+b;
      if (!cordActive(cb)){ ctTimer[idx]=0; continue; }
      var hit=false, hx=0, hy=0, bestD=1e9;
      for (var i2=1;i2<SEG-3;i2+=3){
        var ax=ca.px[i2], ay=ca.py[i2], bx2=ca.px[i2+3], by2=ca.py[i2+3];
        for (var j2=1;j2<SEG-3;j2+=3){
          var d2 = segSegDist2(ax,ay,bx2,by2, cb.px[j2],cb.py[j2], cb.px[j2+3],cb.py[j2+3], ctPt);
          if (d2 < bestD){ bestD=d2; hx=ctPt.x; hy=ctPt.y; }
          if (d2 < t2){ hit=true; break; }
        }
        if (hit) break;
      }
      if (hit){
        ctTimer[idx] += dt;
        if (ctTimer[idx] > 2.2){
          ca.hot = 1; cb.hot = 1;
          if (ctCount < ctPts.length){ ctPts[ctCount].x=hx; ctPts[ctCount].y=hy; ctCount++; }
          if (sparkCd <= 0){
            sparkBurst(hx, hy, 13);
            sndSpark();
            sparkCd = rand(0.09, 0.19);
          }
          var drain = dt*0.24;
          if (ca.call){ ca.call.sat -= drain; ca.call.strained = true; }
          if (cb.call){ cb.call.sat -= drain; cb.call.strained = true; }
        } else {
          ca.hot = max(ca.hot, ctTimer[idx]/2.2*0.5);
          cb.hot = max(cb.hot, ctTimer[idx]/2.2*0.5);
        }
      } else {
        ctTimer[idx] = max(0, ctTimer[idx] - dt*2.4);
      }
    }
  }
}

/* ============================================================
   INPUT
   ============================================================ */
var drag = {active:false, id:-1, x:0, y:0, sx:0, sy:0, cord:null, end:-1, mode:'', hoverJack:-1, touch:false, moved:false};
var pointerInside = false;

function evPos(e){
  var r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function nearestJack(x,y,mult){
  var bi=-1, bd=1e9;
  for (var i=0;i<=NJACK;i++){
    var j=L.jacks[i];
    var d=(j.x-x)*(j.x-x)+(j.y-y)*(j.y-y);
    var rr = j.r*mult; rr*=rr;
    if (d<rr && d<bd){ bd=d; bi=i; }
  }
  return bi;
}
function hitMute(x,y){
  var dx=x-L.mute.x, dy=y-L.mute.y, r=L.mute.r*2.0;
  return dx*dx+dy*dy < r*r;
}

function beginDrag(x,y,isTouch){
  var grabR = isTouch ? 30 : 21;
  var gr2 = grabR*grabR;
  // 1) plugs
  var best=null, bd=gr2;
  for (var i=0;i<NCORDS;i++){
    var c=cords[i];
    if (cordActive(c)) continue;         // locked while a call is live
    for (var ei=0;ei<2;ei++){
      var e=c.ends[ei];
      if (e.mode==='hand') continue;
      var p = cordEndPos(c, ei);
      var d=(p.x-x)*(p.x-x)+(p.y-y)*(p.y-y);
      if (d<bd){ bd=d; best={c:c, ei:ei}; }
    }
  }
  if (best){
    var c2=best.c, ei2=best.ei;
    if (c2.ends[ei2].mode==='jack'){ sndPop(); }
    unseatPlug(c2, ei2, false);
    c2.ends[ei2].mode='hand';
    drag.cord=c2; drag.end=ei2; drag.mode='plug';
    cordBump(c2, 1.6);
    return true;
  }
  // 2) ringing jack -> take a free cord
  var jn = nearestJack(x,y, isTouch?2.5:1.95);
  if (jn>=0 && jn!==TRUNK){
    var cl = callRingingAt(jn);
    if (cl && plugAt[jn]===0){
      var fc = freeCord();
      if (!fc){ sndReject(); toast('NO FREE CORDS'); return false; }
      seatPlug(fc, 0, jn);
      sndChunk(); dustBurst(L.jacks[jn].x, L.jacks[jn].y);
      cl.answered = true;
      fc.ends[1].mode='hand';
      drag.cord=fc; drag.end=1; drag.mode='plug';
      // pre-drape the rope from the jack toward the hand
      for (var k=0;k<SEG;k++){
        var t=k/(SEG-1);
        fc.px[k]=lerp(L.jacks[jn].x, x, t);
        fc.py[k]=lerp(L.jacks[jn].y, y, t) + sin(t*PI)*16;
        fc.ox[k]=fc.px[k]; fc.oy[k]=fc.py[k];
      }
      return true;
    }
  }
  // 3) grab a cord along its length
  var bc=null, bi=-1, bd2=(grabR*0.95)*(grabR*0.95);
  for (var m=0;m<NCORDS;m++){
    var cc=cords[m];
    for (var s=2;s<SEG-2;s++){
      var dx=cc.px[s]-x, dy=cc.py[s]-y;
      var dd=dx*dx+dy*dy;
      if (dd<bd2){ bd2=dd; bc=cc; bi=s; }
    }
  }
  if (bc){
    bc.grab=bi; bc.grabX=x; bc.grabY=y;
    drag.cord=bc; drag.end=-1; drag.mode='mid';
    return true;
  }
  return false;
}

function endDrag(cancel){
  var c = drag.cord;
  if (!c){ drag.active=false; drag.cord=null; drag.mode=''; drag.hoverJack=-1; return; }
  if (drag.mode==='mid'){
    c.grab=-1;
  } else if (drag.mode==='plug'){
    var ei = drag.end, oth = cordOther(c, ei);
    var placed = false;
    if (!cancel){
      var jn = nearestJack(drag.x, drag.y, drag.touch?2.4:2.0);
      if (jn>=0){
        var otherJack = (c.ends[oth].mode==='jack') ? c.ends[oth].jack : -1;
        if (jn === otherJack){
          sndReject();
          addFloat(L.jacks[jn].x, L.jacks[jn].y-16, 'SAME JACK', 'rgba(226,190,124,.85)');
        } else if (plugAt[jn]!==0){
          sndReject();
          G.jackFlash[jn] = -0.7;
        } else if (jackBusy(jn)){
          sndErr();
          G.jackFlash[jn] = -1;
          addFloat(L.jacks[jn].x, L.jacks[jn].y-16, 'LINE BUSY', '#e0a84e');
          var rc = callRingingAt(otherJack);
          if (rc) rc.patience = max(0.35, rc.patience - 0.6);
        } else {
          seatPlug(c, ei, jn);
          sndChunk();
          dustBurst(L.jacks[jn].x, L.jacks[jn].y);
          var rcl = callRingingAt(jn);
          if (rcl) rcl.answered = true;
          var rcl2 = callRingingAt(otherJack);
          if (rcl2) rcl2.answered = true;
          placed = true;
          tryConnect(c, ei);
        }
      }
    }
    if (!placed && c.ends[ei].mode==='hand'){
      c.ends[ei].mode='ease';
      c.ends[ei].jack=-1;
      if (c.ends[oth].mode!=='jack'){ releaseCord(c, true); }
    }
  }
  drag.active=false; drag.cord=null; drag.mode=''; drag.end=-1; drag.hoverJack=-1; drag.moved=false;
}

function onDown(e){
  audioResume();
  if (drag.active) return;
  var p = evPos(e);
  if (hitMute(p.x, p.y)){
    setMuted(!A.muted);
    sndClick(0.1);
    try{ e.preventDefault(); }catch(err){}
    return;
  }
  if (G.state!=='play') return;
  drag.touch = (e.pointerType === 'touch' || e.pointerType === 'pen');
  drag.x=p.x; drag.y=p.y; drag.sx=p.x; drag.sy=p.y;
  var got = beginDrag(p.x, p.y, drag.touch);
  if (got){
    drag.active=true; drag.id = e.pointerId;
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  }
  try{ e.preventDefault(); }catch(err){}
}
function onMove(e){
  var p = evPos(e);
  pointerInside = true;
  if (!drag.active){ drag.x=p.x; drag.y=p.y; return; }
  if (e.pointerId !== drag.id) return;
  drag.x=p.x; drag.y=p.y;
  if (abs(p.x-drag.sx)+abs(p.y-drag.sy) > 4) drag.moved=true;
  var c=drag.cord;
  if (c && drag.mode==='mid'){ c.grabX=p.x; c.grabY=p.y; }
  if (c && drag.mode==='plug'){
    var jn = nearestJack(p.x,p.y, drag.touch?2.4:2.0);
    drag.hoverJack = jn;
  }
  try{ e.preventDefault(); }catch(err){}
}
function onUp(e){
  if (!drag.active) return;
  if (e.pointerId !== drag.id) return;
  var p = evPos(e);
  drag.x=p.x; drag.y=p.y;
  try{ cv.releasePointerCapture(e.pointerId); }catch(err){}
  endDrag(false);
  drag.id=-1;
  try{ e.preventDefault(); }catch(err){}
}
function onCancel(e){
  if (!drag.active) return;
  endDrag(true);
  drag.id=-1;
}

/* ============================================================
   UPDATE
   ============================================================ */
function update(dt){
  G.prog = difficulty();

  // timers that run in every state
  for (var i=G.particles.length-1;i>=0;i--){
    var p=G.particles[i];
    p.life -= dt;
    if (p.life<=0){ G.particles.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += p.g*dt;
    p.vx *= (1-min(1,dt*1.6));
  }
  for (var f=G.floats.length-1;f>=0;f--){
    var fl=G.floats[f];
    fl.t += dt;
    if (fl.t>=fl.life) G.floats.splice(f,1);
  }
  if (G.shakeT>0){ G.shakeT-=dt; if (G.shakeT<=0){ G.shake=0; } else { G.shake *= (1-min(1,dt*4.2)); } }
  G.flash = max(0, G.flash - dt*2.1);
  if (G.toastT>0) G.toastT -= dt;
  if (G.pipClearT>0){ G.pipClearT = max(0, G.pipClearT - dt*1.15); if (G.pipClearT===0) G.pipClearIdx=-1; }
  for (var k=0;k<=NJACK;k++){
    var v = G.jackFlash[k];
    if (v>0) G.jackFlash[k] = max(0, v - dt*2.4);
    else if (v<0) G.jackFlash[k] = min(0, v + dt*2.4);
  }
  for (var ci=0;ci<NCORDS;ci++){
    var cc=cords[ci];
    for (var ee=0;ee<2;ee++){
      if (cc.ends[ee].seatT>0 && cc.ends[ee].seatT<1) cc.ends[ee].seatT = min(1, cc.ends[ee].seatT + dt*6);
    }
  }

  if (G.state!=='play') return;

  G.t += dt;
  if (G.t > 58) G.ldUnlocked = true;

  // ---- spawn ----
  G.spawnTimer -= dt;
  if (G.spawnTimer<=0){
    var live = 0;
    for (var q=0;q<G.calls.length;q++) if (G.calls[q].state==='ring') live++;
    if (live < maxConcurrent() && G.calls.length < 5 && freeCord() && G.t < SHIFT_LEN-3){
      spawnCall();
      // occasional double
      if (G.prog>0.45 && Math.random()<0.20 && live+1 < maxConcurrent()) spawnCall();
      G.spawnTimer = spawnInterval();
    } else {
      G.spawnTimer = 0.55;
    }
  }

  // ---- calls ----
  for (var c2=G.calls.length-1;c2>=0;c2--){
    var cl = G.calls[c2];
    if (cl.state==='ring'){
      var rate = cl.answered ? 0.62 : 1;
      cl.patience -= dt*rate;
      cl.ringT -= dt;
      if (cl.ringT<=0){ sndRing(); cl.ringT = 2.35; }
      if (cl.patience<=0){
        // caller gives up
        if (cl.cord) releaseCord(cl.cord, true);
        // the operator's cord for this caller goes back on the rack whole,
        // so a dead plug never strands itself in somebody else's jack
        for (var z=0;z<NCORDS;z++){
          var cz=cords[z];
          if (cordActive(cz)) continue;
          var serving = (cz.ends[0].mode==='jack' && cz.ends[0].jack===cl.from) ||
                        (cz.ends[1].mode==='jack' && cz.ends[1].jack===cl.from);
          if (!serving) continue;
          if (cz.ends[0].mode==='hand' || cz.ends[1].mode==='hand'){
            // player still holds one end: only pull the dead one
            if (cz.ends[0].mode==='jack' && cz.ends[0].jack===cl.from) unseatPlug(cz, 0, true);
            if (cz.ends[1].mode==='jack' && cz.ends[1].jack===cl.from) unseatPlug(cz, 1, true);
          } else {
            releaseCord(cz, true);
          }
        }
        endCall(cl, 'hangup');
        continue;
      }
    } else if (cl.state==='dial'){
      if (!cl.strained && cl.sat<1 && cl.sat>0) cl.sat = min(1, cl.sat + dt*0.32);
      cl.dialT -= dt;
      cl.dialClick -= dt;
      if (cl.dialClick<=0){ sndClick(0.09); cl.dialClick = 0.14 + Math.random()*0.05; }
      if (cl.sat<=0){ endCall(cl,'crosstalk'); continue; }
      if (cl.dialT<=0){ sndTrunkDone(); startTalk(cl); }
    } else if (cl.state==='talk'){
      cl.talkT -= dt;
      cl.connT += dt;
      if (!cl.strained && cl.sat<1 && cl.sat>0) cl.sat = min(1, cl.sat + dt*0.32);
      if (cl.sat<=0){ endCall(cl,'crosstalk'); continue; }
      if (cl.talkT<=0){ endCall(cl,'done'); continue; }
    }
  }

  updateCrosstalk(dt);

  // ---- end conditions ----
  if (G.complaints>=5){ lose(); return; }
  if (G.t>=SHIFT_LEN){ G.t=SHIFT_LEN; win(); return; }
}

function physicsStep(){
  for (var i=0;i<NCORDS;i++) cordPhys(cords[i]);
}

/* ============================================================
   RENDER
   ============================================================ */
function drawSpaced(c, text, x, y, sp, align){
  var total = 0, i;
  for (i=0;i<text.length;i++) total += c.measureText(text[i]).width + sp;
  total -= sp;
  var sx = x;
  if (align==='center') sx = x - total/2;
  else if (align==='right') sx = x - total;
  var oldAlign = c.textAlign;
  c.textAlign='left';
  for (i=0;i<text.length;i++){
    c.fillText(text[i], sx, y);
    sx += c.measureText(text[i]).width + sp;
  }
  c.textAlign = oldAlign;
  return total;
}

function lampGlow(c, x, y, r, intensity, col){
  if (intensity<=0.003) return;
  var R = r*4.6;
  var g = c.createRadialGradient(x,y,0,x,y,R);
  g.addColorStop(0, 'rgba('+col+','+(0.55*intensity).toFixed(3)+')');
  g.addColorStop(0.22,'rgba('+col+','+(0.24*intensity).toFixed(3)+')');
  g.addColorStop(0.55,'rgba('+col+','+(0.07*intensity).toFixed(3)+')');
  g.addColorStop(1,'rgba('+col+',0)');
  c.fillStyle=g;
  c.beginPath(); c.arc(x,y,R,0,TAU); c.fill();
  // bulb
  var g2 = c.createRadialGradient(x-r*0.25,y-r*0.3,r*0.05,x,y,r);
  g2.addColorStop(0,'rgba(255,252,242,'+(0.96*intensity).toFixed(3)+')');
  g2.addColorStop(0.42,'rgba('+col+','+(0.92*intensity).toFixed(3)+')');
  g2.addColorStop(1,'rgba('+col+','+(0.42*intensity).toFixed(3)+')');
  c.fillStyle=g2;
  c.beginPath(); c.arc(x,y,r*0.96,0,TAU); c.fill();
}

function drawPatienceRing(c, x, y, r, frac, warn){
  var R = r*2.15;
  c.lineWidth = max(2, r*0.34);
  c.strokeStyle = 'rgba(0,0,0,0.42)';
  c.beginPath(); c.arc(x,y,R,0,TAU); c.stroke();
  var col;
  if (frac>0.55) col='rgba(150,214,142,0.92)';
  else if (frac>0.28) col='rgba(230,190,92,0.95)';
  else col='rgba(226,106,84,0.97)';
  c.strokeStyle=col;
  c.lineCap='round';
  c.beginPath(); c.arc(x,y,R,-PI/2, -PI/2 + TAU*clamp(frac,0,1)); c.stroke();
  c.lineCap='butt';
  if (frac<0.28 && warn){
    var pulse = 0.35+0.35*sin(perfNow*0.014);
    c.strokeStyle='rgba(226,106,84,'+(pulse*0.5).toFixed(3)+')';
    c.lineWidth = max(3, r*0.6);
    c.beginPath(); c.arc(x,y,R+2,-PI/2, -PI/2 + TAU*clamp(frac,0,1)); c.stroke();
  }
}

function drawTag(c, x, by, text, gold, noPointer){
  c.font = clamp(L.jr*0.62, 9, 12.5).toFixed(1)+'px Georgia, serif';
  var w = c.measureText(text).width + 16;
  var h = clamp(L.jr*1.05, 15, 20);
  var y = by - h*0.5;
  c.save();
  c.shadowColor='rgba(0,0,0,0.6)'; c.shadowBlur=8; c.shadowOffsetY=2;
  var g = c.createLinearGradient(0,y-h/2,0,y+h/2);
  if (gold){ g.addColorStop(0,'#3a2a10'); g.addColorStop(1,'#1e1408'); }
  else { g.addColorStop(0,'#241a14'); g.addColorStop(1,'#140d08'); }
  c.fillStyle=g;
  roundRect(c, x-w/2, y-h/2, w, h, 3); c.fill();
  c.restore();
  c.strokeStyle = gold ? 'rgba(240,206,130,0.85)' : 'rgba(214,176,110,0.5)';
  c.lineWidth=1;
  roundRect(c, x-w/2+0.5, y-h/2+0.5, w-1, h-1, 3); c.stroke();
  c.fillStyle = gold ? '#f6dfa6' : '#efe0bd';
  c.textAlign='center'; c.textBaseline='middle';
  c.fillText(text, x, y+0.5);
  // little pointer
  if (!noPointer){
    c.fillStyle = gold ? 'rgba(240,206,130,0.85)' : 'rgba(214,176,110,0.5)';
    c.beginPath();
    c.moveTo(x-3.5, y+h/2); c.lineTo(x+3.5, y+h/2); c.lineTo(x, y+h/2+4.5);
    c.closePath(); c.fill();
  }
}

function cordPath(c, cd){
  c.beginPath();
  c.moveTo(cd.px[0], cd.py[0]);
  for (var i=1;i<SEG-1;i++){
    var mx=(cd.px[i]+cd.px[i+1])*0.5, my=(cd.py[i]+cd.py[i+1])*0.5;
    c.quadraticCurveTo(cd.px[i], cd.py[i], mx, my);
  }
  c.lineTo(cd.px[SEG-1], cd.py[SEG-1]);
}

function drawCord(c, cd){
  var w = clamp(L.jr*0.30, 3.6, 6.4);
  c.lineJoin='round'; c.lineCap='round';
  // shadow
  c.save();
  c.translate(3,5);
  cordPath(c, cd);
  c.strokeStyle='rgba(0,0,0,0.30)'; c.lineWidth=w+1.5; c.stroke();
  c.restore();
  // outline
  cordPath(c, cd);
  c.strokeStyle=cd.col.dark; c.lineWidth=w+2.2; c.stroke();
  // body
  c.strokeStyle=cd.col.mid; c.lineWidth=w; c.stroke();
  // fabric weave (dashed lighter)
  c.save();
  c.setLineDash([w*0.85, w*1.25]);
  c.lineDashOffset = -(cd.id*3);
  c.strokeStyle=cd.col.lite; c.globalAlpha=0.55; c.lineWidth=w*0.72; c.stroke();
  c.restore();
  // top sheen
  c.save();
  c.translate(-0.6,-1.1);
  cordPath(c, cd);
  c.strokeStyle='rgba(255,246,226,0.16)'; c.lineWidth=w*0.28; c.stroke();
  c.restore();
  if (cd.hot>0.01){
    cordPath(c, cd);
    c.strokeStyle='rgba(150,215,255,'+(0.30*cd.hot*(0.6+0.4*sin(perfNow*0.03))).toFixed(3)+')';
    c.lineWidth=w+3.4; c.stroke();
  }
}

function drawPlug(c, cd, ei){
  var i = ei===0?0:SEG-1;
  var ni = ei===0?1:SEG-2;
  var tx=cd.px[i], ty=cd.py[i];
  var dx=tx-cd.px[ni], dy=ty-cd.py[ni];
  var len=Math.hypot(dx,dy);
  if (len<0.001){ dx=0; dy=1; len=1; }
  dx/=len; dy/=len;
  var e = cd.ends[ei];
  var push = (e.mode==='jack') ? (1-clamp(e.seatT,0,1))*7 : 0;
  var ang = Math.atan2(dy,dx);
  var bodyL = clamp(L.jr*0.98, 15, 24);
  var bodyW = clamp(L.jr*0.42, 6.5, 10);

  c.save();
  c.translate(tx - dx*push, ty - dy*push);
  c.rotate(ang);
  // shadow
  c.fillStyle='rgba(0,0,0,0.34)';
  roundRect(c, -bodyL-1+3, -bodyW/2+4, bodyL+7, bodyW, bodyW*0.45); c.fill();
  // bakelite body
  var g = c.createLinearGradient(0,-bodyW/2,0,bodyW/2);
  g.addColorStop(0,'#4b4139'); g.addColorStop(0.32,'#231c17'); g.addColorStop(0.72,'#14100c'); g.addColorStop(1,'#332a23');
  c.fillStyle=g;
  roundRect(c, -bodyL, -bodyW/2, bodyL*0.82, bodyW, bodyW*0.42); c.fill();
  // collar
  var g2 = c.createLinearGradient(0,-bodyW/2,0,bodyW/2);
  g2.addColorStop(0,'#e9d3a1'); g2.addColorStop(0.42,'#b28f52'); g2.addColorStop(1,'#7a5f2e');
  c.fillStyle=g2;
  roundRect(c, -bodyL*0.22, -bodyW/2*0.92, bodyL*0.30, bodyW*0.92, bodyW*0.3); c.fill();
  // brass tip
  var g3 = c.createLinearGradient(0,-bodyW*0.34,0,bodyW*0.34);
  g3.addColorStop(0,'#ffeec2'); g3.addColorStop(0.4,'#d8b46e'); g3.addColorStop(1,'#8d6c30');
  c.fillStyle=g3;
  roundRect(c, bodyL*0.06, -bodyW*0.30, bodyL*0.42, bodyW*0.60, bodyW*0.28); c.fill();
  // highlight
  c.fillStyle='rgba(255,255,255,0.16)';
  roundRect(c, -bodyL*0.96, -bodyW*0.40, bodyL*0.74, bodyW*0.22, bodyW*0.1); c.fill();
  c.restore();
}

var perfNow = 0;

function drawJackDynamics(c){
  var i, j, cl;
  // busy amber + occupied ring
  for (i=0;i<=NJACK;i++){
    j = L.jacks[i];
    var busy = jackBusy(i);
    var fl = G.jackFlash[i];
    if (busy){
      lampGlow(c, j.lampX, j.lampY, j.lampR, 0.55, '226,150,60');
    }
    if (fl>0){
      c.save();
      c.globalAlpha = fl*0.55;
      c.strokeStyle='#fff3d6'; c.lineWidth=2.4;
      c.beginPath(); c.arc(j.x, j.y, j.r*(1.15+ (1-fl)*0.8), 0, TAU); c.stroke();
      c.restore();
    } else if (fl<0){
      var a=-fl;
      c.save();
      c.globalAlpha = a*0.5;
      var rg = c.createRadialGradient(j.x,j.y,0,j.x,j.y,j.r*3.2);
      rg.addColorStop(0,'rgba(228,86,64,0.85)'); rg.addColorStop(1,'rgba(228,86,64,0)');
      c.fillStyle=rg; c.beginPath(); c.arc(j.x,j.y,j.r*3.2,0,TAU); c.fill();
      c.restore();
    }
  }
  // calls
  for (i=0;i<G.calls.length;i++){
    cl = G.calls[i];
    var jf = L.jacks[cl.from];
    if (cl.state==='ring'){
      var ph = (perfNow*0.006 + cl.lampPhase);
      var blink = 0.66 + 0.34*sin(ph*2.4);
      if (cl.answered) blink = 0.85;
      lampGlow(c, jf.lampX, jf.lampY, jf.lampR, blink, '255,196,110');
      drawPatienceRing(c, jf.lampX, jf.lampY, jf.lampR, cl.patience/cl.patMax, true);
      // request tag
      var label = cl.ld ? ('→ '+cl.city) : ('→ '+L.jacks[cl.to].name);
      var ty, anchorX = jf.x;
      if (L.tagAbove){
        ty = jf.lampY - jf.lampR*1.8 - 3;
      } else {
        ty = jf.labY + jf.labH*0.5 + 1;   // slotted over its own designation strip
      }
      drawTag(c, anchorX, ty, label, cl.ld, !L.tagAbove);
      if (cl.ld){
        // gold ring accent around the calling jack
        c.save();
        c.strokeStyle='rgba(244,206,120,'+(0.35+0.25*sin(perfNow*0.008)).toFixed(3)+')';
        c.lineWidth=2;
        c.beginPath(); c.arc(jf.x, jf.y, jf.r*1.34, 0, TAU); c.stroke();
        c.restore();
      }
    } else if (cl.state==='dial' || cl.state==='talk'){
      var lit = cl.state==='dial' ? (0.6+0.4*sin(perfNow*0.02)) : 1;
      var col = cl.sat<0.999 ? '255,150,110' : '255,214,150';
      lampGlow(c, jf.lampX, jf.lampY, jf.lampR, lit*(0.55+0.45*cl.sat), col);
      var jt = L.jacks[cl.to];
      lampGlow(c, jt.lampX, jt.lampY, jt.lampR, lit*(0.55+0.45*cl.sat), col);
      if (cl.sat<0.999){
        drawPatienceRing(c, jf.lampX, jf.lampY, jf.lampR, cl.sat, true);
        drawPatienceRing(c, jt.lampX, jt.lampY, jt.lampR, cl.sat, true);
      }
      if (cl.state==='dial'){
        // trunk dialing indicator
        var jT = L.jacks[TRUNK];
        c.save();
        c.translate(jT.x, jT.y);
        var a0 = perfNow*0.012;
        c.strokeStyle='rgba(250,214,132,0.9)'; c.lineWidth=2.4; c.lineCap='round';
        c.beginPath(); c.arc(0,0, jT.r*1.5, a0, a0+PI*0.7); c.stroke();
        c.strokeStyle='rgba(250,214,132,0.4)';
        c.beginPath(); c.arc(0,0, jT.r*1.5, a0+PI, a0+PI*1.55); c.stroke();
        c.lineCap='butt';
        c.restore();
        c.save();
        c.font = clamp(L.jr*0.52,8,11).toFixed(1)+'px Georgia, serif';
        c.fillStyle='rgba(250,214,132,0.85)';
        c.textAlign='center'; c.textBaseline='middle';
        c.fillText('DIALING '+cl.city, jT.x, jT.y - jT.r*2.3);
        c.restore();
      }
      // murmur waves near the pair
      if (cl.state==='talk'){
        var wob = sin(perfNow*0.005 + cl.lampPhase)*0.5+0.5;
        c.save();
        c.globalAlpha = 0.12+0.10*wob;
        c.strokeStyle='#f0dcae'; c.lineWidth=1.2;
        c.beginPath(); c.arc(jf.x, jf.y, jf.r*(1.5+wob*0.5), -PI*0.85, -PI*0.15); c.stroke();
        c.beginPath(); c.arc(jt.x, jt.y, jt.r*(1.5+(1-wob)*0.5), -PI*0.85, -PI*0.15); c.stroke();
        c.restore();
      }
    }
  }
  // hover target highlight while dragging a plug
  if (drag.active && drag.mode==='plug' && drag.hoverJack>=0){
    var jh = L.jacks[drag.hoverJack];
    var ok = (plugAt[drag.hoverJack]===0) && !jackBusy(drag.hoverJack);
    c.save();
    c.strokeStyle = ok ? 'rgba(240,224,180,0.85)' : 'rgba(228,110,80,0.85)';
    c.lineWidth = 2;
    c.setLineDash([4,4]);
    c.lineDashOffset = -perfNow*0.02;
    c.beginPath(); c.arc(jh.x, jh.y, jh.r*1.5, 0, TAU); c.stroke();
    c.restore();
  }
}

function drawCrosstalk(c){
  for (var i=0;i<ctCount;i++){
    var p = ctPts[i];
    var pulse = 0.55 + 0.45*sin(perfNow*0.035 + i);
    var R = clamp(L.jr*0.9, 13, 24) * (0.8+0.2*pulse);
    var g = c.createRadialGradient(p.x,p.y,0,p.x,p.y,R);
    g.addColorStop(0,'rgba(226,246,255,'+(0.55*pulse).toFixed(3)+')');
    g.addColorStop(0.35,'rgba(150,214,255,'+(0.28*pulse).toFixed(3)+')');
    g.addColorStop(1,'rgba(110,180,255,0)');
    c.fillStyle=g;
    c.beginPath(); c.arc(p.x,p.y,R,0,TAU); c.fill();
    // little arcing filaments
    c.strokeStyle='rgba(232,248,255,'+(0.55*pulse).toFixed(3)+')';
    c.lineWidth=1.2;
    for (var k=0;k<3;k++){
      var a0 = rand(0,TAU), len = R*rand(0.4,0.9);
      c.beginPath();
      c.moveTo(p.x, p.y);
      var xx=p.x, yy=p.y;
      for (var seg=0;seg<3;seg++){
        xx += cos(a0)*len/3 + rand(-3,3);
        yy += sin(a0)*len/3 + rand(-3,3);
        c.lineTo(xx,yy);
      }
      c.stroke();
    }
  }
}

function drawParticles(c){
  for (var i=0;i<G.particles.length;i++){
    var p=G.particles[i];
    var t = p.life/p.max;
    if (p.kind===2){
      var r = p.size*(1.6-t);
      var g = c.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
      var cc = p.col===1 ? '255,226,170' : '190,230,255';
      g.addColorStop(0,'rgba('+cc+','+(0.5*t).toFixed(3)+')');
      g.addColorStop(1,'rgba('+cc+',0)');
      c.fillStyle=g; c.beginPath(); c.arc(p.x,p.y,r,0,TAU); c.fill();
    } else if (p.col===1){
      c.fillStyle='rgba(240,222,180,'+(0.5*t).toFixed(3)+')';
      c.beginPath(); c.arc(p.x,p.y,p.size,0,TAU); c.fill();
    } else {
      c.fillStyle='rgba(190,235,255,'+(0.9*t).toFixed(3)+')';
      c.fillRect(p.x-p.size*0.5, p.y-p.size*0.5, p.size, p.size*1.4);
    }
  }
}

function drawFloats(c){
  c.textAlign='center'; c.textBaseline='middle';
  for (var i=0;i<G.floats.length;i++){
    var f=G.floats[i];
    var t=f.t/f.life;
    var a = t<0.15 ? t/0.15 : (1-(t-0.15)/0.85);
    c.save();
    c.globalAlpha = clamp(a,0,1);
    c.font = clamp(L.jr*0.72,11,15).toFixed(1)+'px Georgia, serif';
    c.fillStyle='rgba(0,0,0,0.55)';
    c.fillText(f.text, f.x+1, f.y - t*26 + 1);
    c.fillStyle=f.col;
    c.fillText(f.text, f.x, f.y - t*26);
    c.restore();
  }
}

function clockText(t){
  var totalMin = (t/SHIFT_LEN)*180;   // 9:00 PM -> midnight
  var mins = 9*60 + totalMin;
  var hh = floor(mins/60), mm = floor(mins%60);
  var suffix = 'PM';
  var h12 = hh;
  if (hh>=12){ h12 = hh-12; suffix='AM'; }
  if (h12===0){ h12=12; }
  if (hh>=12 && mm===0 && floor(mins)===720) return '12:00 AM';
  return h12+':'+(mm<10?'0':'')+mm+' '+suffix;
}

function drawHUD(c){
  var pad = max(8, min(W,H)*0.022);
  // progress rail
  var railH = 4;
  c.fillStyle='rgba(0,0,0,0.55)'; c.fillRect(0,0,W,railH);
  var pr = clamp(G.t/SHIFT_LEN,0,1);
  var pg = c.createLinearGradient(0,0,W,0);
  pg.addColorStop(0,'#8a6a30'); pg.addColorStop(0.6,'#d8b06a'); pg.addColorStop(1,'#f2dda6');
  c.fillStyle=pg; c.fillRect(0,0,W*pr,railH);
  c.fillStyle='rgba(255,240,205,0.22)';
  for (var h=1;h<3;h++) c.fillRect(W*(h/3)-0.5, 0, 1, railH);
  if (pr>0){
    c.fillStyle='rgba(255,244,214,0.9)';
    c.fillRect(W*pr-1.5, 0, 3, railH);
  }

  var midY = railH + (L.topH-railH)*0.5;
  c.textBaseline='middle';

  // score (left)
  c.textAlign='left';
  c.font='9px Georgia, serif';
  c.fillStyle='rgba(214,176,110,0.62)';
  drawSpaced(c,'SCORE', pad, midY-9, 2.4, 'left');
  c.font = clamp(L.topH*0.42, 17, 24).toFixed(1)+'px Georgia, serif';
  c.fillStyle='#f4e7c9';
  c.fillText(String(G.score), pad, midY+6);
  var sw = c.measureText(String(G.score)).width;
  if (G.streak>=2){
    c.font='11px Georgia, serif';
    c.fillStyle='rgba(150,214,142,0.92)';
    c.textAlign='left';
    c.fillText('×'+(1+min(G.streak,10)*0.1).toFixed(1), pad+sw+8, midY+6);
    c.font='8px Georgia, serif';
    c.fillStyle='rgba(150,214,142,0.55)';
    drawSpaced(c,'STREAK '+G.streak, pad+sw+8, midY-8, 1.6,'left');
  }

  // clock (center)
  c.textAlign='center';
  c.font='8.5px Georgia, serif';
  c.fillStyle='rgba(214,176,110,0.55)';
  drawSpaced(c, L.small?'SHIFT':'NIGHT SHIFT', W*0.5, midY-10, 3, 'center');
  c.font = clamp(L.topH*0.36, 14, 20).toFixed(1)+'px Georgia, serif';
  c.fillStyle='#efe0bd';
  c.fillText(clockText(G.t), W*0.5, midY+7);

  // complaints (right, before the mute)
  var pipR = clamp(L.topH*0.085, 4.2, 6.2);
  var gapP = pipR*2.9;
  var rightEdge = L.mute.x - L.mute.r - 12;
  var startX = rightEdge - gapP*4;
  c.textAlign='right';
  c.font='8.5px Georgia, serif';
  c.fillStyle='rgba(214,176,110,0.55)';
  drawSpaced(c,'COMPLAINTS', rightEdge+pipR, midY-11, 2.2,'right');
  for (var i=0;i<5;i++){
    var x = startX + i*gapP, y = midY+5;
    var filled = i < G.complaints;
    if (filled){
      var gg = c.createRadialGradient(x,y,0,x,y,pipR*2.6);
      gg.addColorStop(0,'rgba(230,90,66,0.6)'); gg.addColorStop(1,'rgba(230,90,66,0)');
      c.fillStyle=gg; c.beginPath(); c.arc(x,y,pipR*2.6,0,TAU); c.fill();
      c.fillStyle='#e2604a';
    } else {
      c.fillStyle='rgba(20,12,7,0.75)';
    }
    c.beginPath(); c.arc(x,y,pipR,0,TAU); c.fill();
    c.strokeStyle = filled?'rgba(255,190,160,0.7)':'rgba(214,176,110,0.34)';
    c.lineWidth=1;
    c.beginPath(); c.arc(x,y,pipR,0,TAU); c.stroke();
    if (i===G.pipClearIdx && G.pipClearT>0){
      var pc = G.pipClearT, gr = 1-pc;
      c.save();
      c.globalAlpha = pc;
      c.fillStyle = 'rgba(226,96,74,'+(pc*0.85).toFixed(3)+')';
      c.beginPath(); c.arc(x,y,pipR*(1-gr*0.7),0,TAU); c.fill();
      c.strokeStyle = 'rgba(178,226,164,'+(pc*0.9).toFixed(3)+')';
      c.lineWidth = max(1.2, pipR*0.42*pc);
      c.beginPath(); c.arc(x,y,pipR*(1+gr*2.4),0,TAU); c.stroke();
      c.restore();
    }
  }

  // goodwill ledger: progress toward wiping one complaint
  if (G.complaints>0 || G.goodRun>0){
    var barW = gapP*4, barX = startX - pipR, barY = midY + pipR + 5.5;
    c.fillStyle='rgba(0,0,0,0.5)';
    c.fillRect(barX, barY, barW, 2);
    var frac = clamp(G.goodRun/MERCY_RUN, 0, 1);
    c.fillStyle = frac>=1 ? 'rgba(178,226,164,0.95)' : 'rgba(214,176,110,0.75)';
    c.fillRect(barX, barY, barW*frac, 2);
  }

  // mute bell
  drawBell(c, L.mute.x, L.mute.y, L.mute.r, A.muted);
}

function drawBell(c, x, y, r, muted){
  c.save();
  c.translate(x,y);
  c.strokeStyle = muted ? 'rgba(214,176,110,0.42)' : 'rgba(238,208,150,0.92)';
  c.fillStyle = muted ? 'rgba(214,176,110,0.13)' : 'rgba(238,208,150,0.22)';
  c.lineWidth = max(1.2, r*0.14);
  var s = r/12;
  c.beginPath();
  c.moveTo(-7*s, 5*s);
  c.bezierCurveTo(-6.4*s, -1*s, -5.2*s, -3.4*s, -3.2*s, -5*s);
  c.bezierCurveTo(-3.2*s, -8.4*s, 3.2*s, -8.4*s, 3.2*s, -5*s);
  c.bezierCurveTo(5.2*s, -3.4*s, 6.4*s, -1*s, 7*s, 5*s);
  c.closePath();
  c.fill(); c.stroke();
  c.beginPath();
  c.moveTo(-2.4*s, 5*s); c.lineTo(2.4*s, 5*s);
  c.stroke();
  c.beginPath(); c.arc(0, 7.4*s, 1.5*s, 0, TAU); c.fill(); c.stroke();
  if (muted){
    c.strokeStyle='rgba(226,106,84,0.95)';
    c.lineWidth=max(1.4, r*0.16);
    c.beginPath(); c.moveTo(-8*s,-8*s); c.lineTo(8*s,9*s); c.stroke();
  }
  c.restore();
}

function drawToast(c){
  if (G.toastT<=0) return;
  var a = clamp(G.toastT/0.45,0,1);
  var y = L.rackY - 26;
  c.save();
  c.globalAlpha=a;
  c.font = clamp(L.jr*0.62,10,13).toFixed(1)+'px Georgia, serif';
  var w = c.measureText(G.toast).width+26;
  c.fillStyle='rgba(16,10,6,0.85)';
  roundRect(c, W/2-w/2, y-13, w, 26, 3); c.fill();
  c.strokeStyle='rgba(214,176,110,0.4)'; c.lineWidth=1;
  roundRect(c, W/2-w/2+0.5, y-12.5, w-1, 25, 3); c.stroke();
  c.fillStyle='#efe0bd';
  c.textAlign='center'; c.textBaseline='middle';
  drawSpaced(c, G.toast, W/2, y, 1.6, 'center');
  c.restore();
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.save();
  var sh = G.shake*ease(G.shakeT/0.34);
  if (sh>0.05){
    ctx.translate(rand(-sh,sh), rand(-sh,sh));
  }
  ctx.drawImage(board, 0, 0, W, H);
  drawJackDynamics(ctx);

  // cords: idle first, then live, dragged last
  var i;
  for (i=0;i<NCORDS;i++){ if (!cordActive(cords[i]) && cords[i]!==drag.cord) drawCordFull(cords[i]); }
  for (i=0;i<NCORDS;i++){ if (cordActive(cords[i]) && cords[i]!==drag.cord) drawCordFull(cords[i]); }
  if (drag.cord) drawCordFull(drag.cord);

  drawCrosstalk(ctx);
  drawParticles(ctx);
  drawFloats(ctx);
  ctx.restore();

  // vignette + flashes (not shaken)
  if (vignette){ ctx.fillStyle=vignette; ctx.fillRect(0,0,W,H); }
  if (G.flash>0.002){
    ctx.fillStyle='rgba(196,54,32,'+(G.flash*0.20).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
  }
  drawHUD(ctx);
  drawToast(ctx);
}

function drawCordFull(cd){
  drawCord(ctx, cd);
  drawPlug(ctx, cd, 0);
  drawPlug(ctx, cd, 1);
}
