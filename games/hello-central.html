function win(){
  if (G.state!=='play') return;
  G.state='win';
  for (var i=G.calls.length-1;i>=0;i--){
    var cl=G.calls[i];
    murmurStop(cl.murmur); cl.murmur=null;
    if (cl.cord) releaseCord(cl.cord, true);
  }
  G.calls.length=0;
  murmurStopAll();
  sndWin();
  showWin();
}
function lose(){
  if (G.state!=='play') return;
  G.state='lose';
  for (var i=G.calls.length-1;i>=0;i--){
    var cl=G.calls[i];
    murmurStop(cl.murmur); cl.murmur=null;
    if (cl.cord) releaseCord(cl.cord, true);
  }
  G.calls.length=0;
  murmurStopAll();
  shake(9);
  sndFired();
  showLose();
}

function resetGame(){
  murmurStopAll();
  for (var i=0;i<G.calls.length;i++){ murmurStop(G.calls[i].murmur); }
  G.calls.length=0;
  G.t=0; G.score=0; G.connected=0; G.streak=0; G.bestStreak=0; G.complaints=0;
  G.spawnTimer=2.0; G.shake=0; G.shakeT=0; G.flash=0; G.prog=0; G.ldUnlocked=false;
  G.particles.length=0; G.floats.length=0; G.toast=''; G.toastT=0;
  G.pipClearT=0; G.pipClearIdx=-1; G.goodRun=0;
  for (var k=0;k<=NJACK;k++){ G.jackFlash[k]=0; plugAt[k]=0; }
  for (var z=0;z<ctTimer.length;z++) ctTimer[z]=0;
  drag.active=false; drag.cord=null; drag.mode=''; drag.end=-1; drag.id=-1; drag.hoverJack=-1;
  resetCordsToRack();
}

function startGame(){
  audioResume();
  resetGame();
  hideOverlay();
  G.state='play';
  acc = 0;
}
function pauseGame(){
  if (G.state!=='play') return;
  if (drag.active){ endDrag(true); drag.id=-1; }
  G.state='paused';
  // hush the room while paused
  for (var i=0;i<G.calls.length;i++){
    if (G.calls[i].murmur){ murmurStop(G.calls[i].murmur); G.calls[i].murmur=null; }
  }
  showPaused();
}
function resumeGame(){
  if (G.state!=='paused') return;
  audioResume();
  hideOverlay();
  G.state='play';
  for (var i=0;i<G.calls.length;i++){
    var cl=G.calls[i];
    if (cl.state==='talk' && !cl.murmur) cl.murmur = murmurStart();
  }
  acc = 0;
}

/* ============================================================
   LOOP
   ============================================================ */
var lastTs = 0, acc = 0, rafId = 0;
function frame(ts){
  rafId = requestAnimationFrame(frame);
  perfNow = ts;
  var dt = (ts - lastTs)/1000;
  lastTs = ts;
  if (!isFinite(dt) || dt<0) dt = 0;
  dt = min(dt, 0.05);

  if (G.state!=='paused'){
    update(dt);
    acc += dt;
    var steps=0;
    while (acc >= PHYS_DT && steps<3){ physicsStep(); acc -= PHYS_DT; steps++; }
    if (acc > 0.25) acc = 0;
  }
  render();
}

/* ============================================================
   RESIZE
   ============================================================ */
var resizePending = false;
function doResize(){
  resizePending = false;
  var w = Math.max(1, window.innerWidth || document.documentElement.clientWidth || 360);
  var h = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 640);
  DPR = min(window.devicePixelRatio || 1, 2);
  W = w; H = h;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  cv.width = max(1, floor(W*DPR)); cv.height = max(1, floor(H*DPR));
  ctx.setTransform(DPR,0,0,DPR,0,0);

  var hadLayout = L.jacks.length>0;
  var oldSlots = hadLayout ? L.slots.slice(0) : null;
  layout();
  renderBoard();

  if (!hadLayout){
    initCords();
  } else {
    // re-pin endpoints, drag cord points back into view
    for (var i=0;i<NCORDS;i++){
      var c = cords[i];
      for (var ei=0;ei<2;ei++){
        var t = endTarget(c, ei);
        var e = c.ends[ei];
        if (e.mode!=='hand'){ e.x=t.x; e.y=t.y; }
      }
      for (var k=0;k<SEG;k++){
        if (!isFinite(c.px[k])) c.px[k]=W*0.5;
        if (!isFinite(c.py[k])) c.py[k]=H*0.5;
        c.px[k] = clamp(c.px[k], -20, W+20);
        c.py[k] = clamp(c.py[k], 0, H-3);
        c.ox[k] = c.px[k]; c.oy[k] = c.py[k];
      }
      c.total = clamp(c.total, 90, Math.hypot(W,H)*1.15);
    }
    // settle
    for (var s=0;s<12;s++) physicsStep();
  }
}
function onResize(){
  if (resizePending) return;
  resizePending = true;
  requestAnimationFrame(doResize);
}

}, false);
window.addEventListener('keydown', function(e){
  var k = e.key;
  if (k==='p'||k==='P'){
    if (G.state==='play'){ pauseGame(); e.preventDefault(); }
    else if (G.state==='paused'){ resumeGame(); e.preventDefault(); }
  } else if (k==='r'||k==='R'){
    if (G.state==='win'||G.state==='lose'){ startGame(); e.preventDefault(); }
  } else if (k==='m'||k==='M'){
    audioResume(); setMuted(!A.muted); e.preventDefault();
  } else if (k===' '||k==='Enter'){
    if (G.state==='start'){ startGame(); e.preventDefault(); }
    else if (G.state==='paused'){ resumeGame(); e.preventDefault(); }
    else if (G.state==='win'||G.state==='lose'){ startGame(); e.preventDefault(); }
  }
}, false);
document.addEventListener('pointerdown', function(){ audioResume(); }, {passive:true, capture:true});
window.addEventListener('touchmove', function(e){
  if (e.target === cv && e.cancelable) e.preventDefault();
}, {passive:false});

/* ============================================================
   BOOT
   ============================================================ */
doResize();
showStart();
lastTs = (window.performance && performance.now) ? performance.now() : 0;
rafId = requestAnimationFrame(frame);

})();
