<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="MANY HAPPY RETURNS - a boomerang arena game. Every throw leaves you unarmed until it curves back.">
<title>MANY HAPPY RETURNS</title>
<style>
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:#0b0718;color:#f6e0b0;
    overflow:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  *{box-sizing:border-box;}
  #wrap{position:fixed;inset:0;overflow:hidden;background:#0b0718;}
  canvas#game{position:absolute;left:0;top:0;display:block;touch-action:none;cursor:none;}
  canvas#game.uicursor{cursor:default;}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>

<!-- aimade.games Arcade SDK -->
<script src="https://aimade.games/arcade.js"></script>
<script>
  window.__arcade = null;
  (function(){ try { Arcade.ready().then(function(a){ window.__arcade = a; }); } catch(e){} })();
  function arcadeSubmit(score, meta){ try { if (typeof score==='number' && isFinite(score)) Arcade.ready().then(function(a){ a.scores.submit(score, meta||{}); }).catch(function(){}); } catch(e){} }
  function arcadeUnlock(slug){ try { Arcade.ready().then(function(a){ a.achievements.unlock(slug); }).catch(function(){}); } catch(e){} }
</script>

<script>
"use strict";
(function(){
/* ============================================================
   MANY HAPPY RETURNS
   Constants, math helpers, view/scaling, audio synthesis
   ============================================================ */

var LW = 1280, LH = 800;                    // logical resolution
var ARENA = { x: 54, y: 108, w: 1172, h: 640 };
ARENA.r = ARENA.x + ARENA.w;
ARENA.b = ARENA.y + ARENA.h;
ARENA.cx = ARENA.x + ARENA.w / 2;
ARENA.cy = ARENA.y + ARENA.h / 2;

var FONT = '"Arial Narrow","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif';

var TAU = Math.PI * 2;
var PI = Math.PI;

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rnd(a, b) { return a + Math.random() * (b - a); }
function rndi(a, b) { return (a + Math.random() * (b - a + 1)) | 0; }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeOutBack(t) { var c = 1.70158 + 1; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
function angDiff(a, b) { var d = (b - a + PI) % TAU; if (d < 0) d += TAU; return d - PI; }
function angToward(cur, target, maxStep) {
  var d = angDiff(cur, target);
  if (d > maxStep) d = maxStep; else if (d < -maxStep) d = -maxStep;
  return cur + d;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------------- canvas + view ---------------- */
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d', { alpha: false });
var view = { scale: 1, offX: 0, offY: 0, dpr: 1, cw: 0, ch: 0 };
var HAS_LETTER_SPACING = ('letterSpacing' in ctx);

function resize() {
  var w = Math.max(1, window.innerWidth || document.documentElement.clientWidth || 1);
  var h = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 1);
  var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  view.dpr = dpr; view.cw = w; view.ch = h;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  var bw = Math.round(w * dpr), bh = Math.round(h * dpr);
  if (canvas.width !== bw || canvas.height !== bh) { canvas.width = bw; canvas.height = bh; }
  var s = Math.min(w / LW, h / LH);
  view.scale = s;
  view.offX = (w - LW * s) * 0.5;
  view.offY = (h - LH * s) * 0.5;
}

function toLogicalX(clientX) {
  var r = canvas.getBoundingClientRect();
  return (clientX - r.left - view.offX) / view.scale;
}
function toLogicalY(clientY) {
  var r = canvas.getBoundingClientRect();
  return (clientY - r.top - view.offY) / view.scale;
}

/* ---------------- text helpers ---------------- */
function setFont(size, weight, spacing) {
  ctx.font = (weight || 700) + ' ' + size + 'px ' + FONT;
  if (HAS_LETTER_SPACING) ctx.letterSpacing = (spacing || 0) + 'px';
}
function txt(str, x, y, size, weight, color, align, spacing) {
  setFont(size, weight, spacing);
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  if (HAS_LETTER_SPACING) ctx.letterSpacing = '0px';
}
function txtGlow(str, x, y, size, weight, color, glow, align, spacing, blur) {
  setFont(size, weight, spacing);
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.save();
  ctx.shadowColor = glow; ctx.shadowBlur = blur === undefined ? 18 : blur;
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.restore();
  if (HAS_LETTER_SPACING) ctx.letterSpacing = '0px';
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  var rr = Math.min(r, w * 0.5, h * 0.5);
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y); ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr); ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr); ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

/* ============================================================
   AUDIO — all synthesized, created only on first user gesture
   ============================================================ */
var AC = null, master = null, noiseBuf = null, muted = false;
var whoosh = null, ambient = null, audioReady = false;

function makeNoiseBuffer(ac) {
  var len = (ac.sampleRate * 2) | 0;
  var buf = ac.createBuffer(1, len, ac.sampleRate);
  var d = buf.getChannelData(0);
  var last = 0;
  for (var i = 0; i < len; i++) {
    var w = Math.random() * 2 - 1;
    last = (last + 0.02 * w) / 1.02;
    d[i] = w * 0.7 + last * 2.2;
  }
  return buf;
}

function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  var ACtor = window.AudioContext || window.webkitAudioContext;
  if (!ACtor) return;
  try { AC = new ACtor(); } catch (e) { AC = null; return; }
  master = AC.createGain();
  master.gain.value = muted ? 0 : 0.85;
  master.connect(AC.destination);
  noiseBuf = makeNoiseBuffer(AC);

  // --- looping boomerang whoosh -------------------------------------
  var wsrc = AC.createBufferSource();
  wsrc.buffer = noiseBuf; wsrc.loop = true;
  var wbp = AC.createBiquadFilter(); wbp.type = 'bandpass'; wbp.frequency.value = 700; wbp.Q.value = 1.6;
  var wg = AC.createGain(); wg.gain.value = 0;
  var wosc = AC.createOscillator(); wosc.type = 'triangle'; wosc.frequency.value = 220;
  var wog = AC.createGain(); wog.gain.value = 0;
  wsrc.connect(wbp); wbp.connect(wg); wg.connect(master);
  wosc.connect(wog); wog.connect(master);
  try { wsrc.start(); wosc.start(); } catch (e) {}
  whoosh = { g: wg, bp: wbp, osc: wosc, og: wog };

  // --- ambient dusk drone -------------------------------------------
  var ag = AC.createGain(); ag.gain.value = 0.0;
  var alp = AC.createBiquadFilter(); alp.type = 'lowpass'; alp.frequency.value = 420; alp.Q.value = 0.6;
  var o1 = AC.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 55;
  var o2 = AC.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = 55.6;
  var o3 = AC.createOscillator(); o3.type = 'sine'; o3.frequency.value = 110;
  var og3 = AC.createGain(); og3.gain.value = 0.35;
  var lfo = AC.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.07;
  var lfog = AC.createGain(); lfog.gain.value = 130;
  lfo.connect(lfog); lfog.connect(alp.frequency);
  o1.connect(alp); o2.connect(alp); o3.connect(og3); og3.connect(alp);
  alp.connect(ag); ag.connect(master);
  // soft wind layer
  var nsrc = AC.createBufferSource(); nsrc.buffer = noiseBuf; nsrc.loop = true;
  var nlp = AC.createBiquadFilter(); nlp.type = 'lowpass'; nlp.frequency.value = 300;
  var ng = AC.createGain(); ng.gain.value = 0.055;
  nsrc.connect(nlp); nlp.connect(ng); ng.connect(ag);
  try { o1.start(); o2.start(); o3.start(); lfo.start(); nsrc.start(); } catch (e) {}
  ambient = { g: ag };
  ag.gain.setTargetAtTime(0.22, AC.currentTime, 1.4);
  audioReady = true;
}

function setMuted(m) {
  muted = m;
  if (master && AC) {
    try { master.gain.setTargetAtTime(muted ? 0 : 0.85, AC.currentTime, 0.02); } catch (e) { master.gain.value = muted ? 0 : 0.85; }
  }
}

function env(node, t0, a, d, peak) {
  var g = node.gain;
  g.cancelScheduledValues(t0);
  g.setValueAtTime(0.0001, t0);
  g.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + a);
  g.exponentialRampToValueAtTime(0.0001, t0 + a + d);
}

function tone(type, f0, f1, dur, peak, delay, dest) {
  if (!AC || muted) return;
  var t0 = AC.currentTime + (delay || 0);
  var o = AC.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t0);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  var g = AC.createGain();
  env(g, t0, Math.min(0.012, dur * 0.25), dur, peak);
  o.connect(g); g.connect(dest || master);
  o.start(t0); o.stop(t0 + dur + 0.08);
}

function noise(dur, peak, f, q, type, delay, sweepTo) {
  if (!AC || muted || !noiseBuf) return;
  var t0 = AC.currentTime + (delay || 0);
  var s = AC.createBufferSource(); s.buffer = noiseBuf;
  s.playbackRate.value = rnd(0.85, 1.2);
  var bp = AC.createBiquadFilter(); bp.type = type || 'bandpass';
  bp.frequency.setValueAtTime(f, t0);
  if (sweepTo) bp.frequency.exponentialRampToValueAtTime(Math.max(40, sweepTo), t0 + dur);
  bp.Q.value = q || 1;
  var g = AC.createGain();
  env(g, t0, 0.006, dur, peak);
  s.connect(bp); bp.connect(g); g.connect(master);
  s.start(t0, Math.random() * 1.4); s.stop(t0 + dur + 0.06);
}

/* --- named sound effects ------------------------------------------ */
var SFX = {
  throwSwish: function (charge) {
    noise(0.22, 0.30, 400 + charge * 900, 1.1, 'bandpass', 0, 1800 + charge * 1400);
    tone('triangle', 320 + charge * 260, 140, 0.16, 0.10);
  },
  hit: function (big) {
    noise(0.07, big ? 0.42 : 0.28, big ? 900 : 1500, 1.4);
    tone('square', big ? 320 : 520, big ? 90 : 160, 0.07, big ? 0.20 : 0.13);
  },
  block: function () {
    tone('square', 1200, 700, 0.06, 0.16);
    noise(0.10, 0.24, 3200, 3);
  },
  pop: function () {
    noise(0.16, 0.34, 1100, 0.8, 'bandpass', 0, 260);
    tone('sawtooth', 420, 70, 0.16, 0.14);
    tone('sine', 900, 300, 0.09, 0.08);
  },
  catchPop: function (combo) {
    var c = Math.min(combo, 8);
    tone('sine', 480 + c * 70, 900 + c * 120, 0.10, 0.24);
    tone('triangle', 960 + c * 110, 1500 + c * 140, 0.14, 0.13, 0.02);
    noise(0.08, 0.14, 2600, 2.2);
  },
  clatter: function () {
    tone('sine', 150, 70, 0.20, 0.16);
    for (var i = 0; i < 5; i++) noise(0.05, 0.16, rnd(1600, 4200), 5, 'bandpass', i * rnd(0.035, 0.075));
  },
  pickup: function () {
    tone('triangle', 620, 1240, 0.10, 0.20);
    tone('sine', 1240, 1560, 0.09, 0.10, 0.05);
  },
  hurt: function () {
    tone('sawtooth', 220, 60, 0.30, 0.26);
    noise(0.28, 0.24, 500, 0.7, 'lowpass');
  },
  chime: function () {
    var f = [523.25, 659.25, 783.99, 1046.5];
    for (var i = 0; i < 4; i++) tone('triangle', f[i], f[i], 0.35, 0.14, i * 0.065);
  },
  wave: function () {
    tone('triangle', 392, 392, 0.25, 0.13);
    tone('triangle', 523.25, 523.25, 0.35, 0.13, 0.10);
  },
  ui: function () { tone('square', 720, 900, 0.05, 0.07); },
  bossRoar: function () {
    tone('sawtooth', 120, 48, 0.9, 0.26);
    tone('square', 62, 34, 1.1, 0.16, 0.05);
    noise(0.8, 0.16, 300, 0.6, 'lowpass');
  },
  bossScreech: function () {
    tone('sawtooth', 900, 260, 0.34, 0.20);
    tone('square', 1350, 420, 0.30, 0.10, 0.02);
    noise(0.3, 0.16, 2400, 2.4);
  },
  bossHurt: function () { tone('square', 260, 120, 0.10, 0.18); noise(0.08, 0.22, 800, 1.2); },
  steal: function () { tone('sawtooth', 300, 1200, 0.28, 0.20); noise(0.24, 0.18, 1800, 1.5, 'bandpass', 0, 500); },
  win: function () {
    var f = [523.25, 659.25, 783.99, 1046.5, 1318.5];
    for (var i = 0; i < 5; i++) tone('triangle', f[i], f[i], 0.7, 0.16, i * 0.13);
  },
  lose: function () {
    tone('sawtooth', 300, 60, 1.2, 0.22);
    tone('sine', 150, 40, 1.4, 0.16, 0.1);
  }
};

function updateAudioLoop(dt) {
  if (!AC || !whoosh) return;
  var t = AC.currentTime;
  var target = 0, tOsc = 0, freq = 700;
  var B = G.boom;
  if (B.state === 'flight' && G.state === 'playing') {
    var sp = Math.sqrt(B.vx * B.vx + B.vy * B.vy);
    var dx = B.x - G.player.x, dy = B.y - G.player.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    var near = clamp(1 - d / 620, 0, 1);
    target = 0.055 + 0.075 * near;
    tOsc = 0.020 + 0.026 * near;
    // doppler-ish: pitch rises as it comes back toward you
    var closing = -(dx * B.vx + dy * B.vy) / Math.max(1, d * Math.max(1, sp));
    freq = 520 + sp * 0.95 + closing * 380;
  }
  try {
    whoosh.g.gain.setTargetAtTime(muted ? 0 : target, t, 0.05);
    whoosh.og.gain.setTargetAtTime(muted ? 0 : tOsc, t, 0.05);
    whoosh.bp.frequency.setTargetAtTime(clamp(freq, 200, 3200), t, 0.05);
    whoosh.osc.frequency.setTargetAtTime(clamp(freq * 0.32, 90, 900), t, 0.05);
  } catch (e) {}
  if (ambient) {
    var amb = (G.state === 'playing' || G.state === 'draft') ? 0.22 : (G.state === 'title' ? 0.16 : 0.10);
    try { ambient.g.gain.setTargetAtTime(amb, t, 0.8); } catch (e) {}
  }
}
/* ============================================================
   BACKGROUND — baked once to an offscreen canvas
   ============================================================ */
var bg = document.createElement('canvas');
bg.width = LW; bg.height = LH;
var bctx = bg.getContext('2d');

function drawTree(c, x, y, s, seed) {
  var r = mulberry32(seed);
  // long shadow on the ground
  c.save();
  c.globalAlpha = 0.30;
  c.fillStyle = '#2a1030';
  c.beginPath();
  c.ellipse(x + 44 * s, y + 8 * s, 62 * s, 15 * s, 0.18, 0, TAU);
  c.fill();
  c.restore();
  // trunk
  var tg = c.createLinearGradient(x - 10 * s, y, x + 12 * s, y);
  tg.addColorStop(0, '#1c0f26'); tg.addColorStop(0.55, '#33192f'); tg.addColorStop(1, '#120a1c');
  c.fillStyle = tg;
  c.beginPath();
  c.moveTo(x - 9 * s, y);
  c.quadraticCurveTo(x - 5 * s, y - 45 * s, x - 6 * s, y - 78 * s);
  c.lineTo(x + 6 * s, y - 78 * s);
  c.quadraticCurveTo(x + 6 * s, y - 42 * s, x + 10 * s, y);
  c.closePath(); c.fill();
  // branches
  c.strokeStyle = '#22122c'; c.lineCap = 'round';
  for (var b = 0; b < 3; b++) {
    var by = y - (52 + b * 16) * s;
    var dir = b % 2 ? 1 : -1;
    c.lineWidth = (5 - b) * s;
    c.beginPath(); c.moveTo(x, by);
    c.quadraticCurveTo(x + dir * 26 * s, by - 8 * s, x + dir * 40 * s, by - 26 * s);
    c.stroke();
  }
  // canopy: clustered blobs
  var lobes = 7 + ((r() * 4) | 0);
  for (var i = 0; i < lobes; i++) {
    var a = r() * TAU, rr = r();
    var cx = x + Math.cos(a) * 46 * s * rr;
    var cy = y - 96 * s + Math.sin(a) * 30 * s * rr;
    var rad = (26 + r() * 22) * s;
    var g = c.createRadialGradient(cx - rad * 0.35, cy - rad * 0.45, rad * 0.1, cx, cy, rad);
    g.addColorStop(0, '#3a2148');
    g.addColorStop(0.55, '#241436');
    g.addColorStop(1, '#150c22');
    c.fillStyle = g;
    c.beginPath(); c.arc(cx, cy, rad, 0, TAU); c.fill();
  }
  // rim light from the setting sun (upper-left)
  c.save();
  c.globalCompositeOperation = 'lighter';
  for (var j = 0; j < lobes; j++) {
    var a2 = r() * TAU, rr2 = r();
    var cx2 = x + Math.cos(a2) * 44 * s * rr2;
    var cy2 = y - 96 * s + Math.sin(a2) * 28 * s * rr2;
    var rad2 = (24 + r() * 20) * s;
    var g2 = c.createRadialGradient(cx2 - rad2 * 0.6, cy2 - rad2 * 0.6, 1, cx2 - rad2 * 0.3, cy2 - rad2 * 0.3, rad2 * 1.1);
    g2.addColorStop(0, 'rgba(255,150,70,0.20)');
    g2.addColorStop(1, 'rgba(255,120,50,0)');
    c.fillStyle = g2;
    c.beginPath(); c.arc(cx2, cy2, rad2, 0, TAU); c.fill();
  }
  c.restore();
  // a few glowing fruit
  c.save();
  for (var f = 0; f < 4; f++) {
    var fa = r() * TAU, fr = r();
    var fx = x + Math.cos(fa) * 42 * s * fr;
    var fy = y - 96 * s + Math.sin(fa) * 26 * s * fr;
    c.shadowColor = 'rgba(255,140,60,0.9)'; c.shadowBlur = 10 * s;
    c.fillStyle = '#ff9d4a';
    c.beginPath(); c.arc(fx, fy, 2.6 * s, 0, TAU); c.fill();
  }
  c.restore();
}

function bakeBackground() {
  var c = bctx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, LW, LH);

  var HORIZON = 66;

  // --- dusk sky ------------------------------------------------------
  var sky = c.createLinearGradient(0, 0, 0, HORIZON + 6);
  sky.addColorStop(0, '#14092c');
  sky.addColorStop(0.40, '#281450');
  sky.addColorStop(0.72, '#4d2258');
  sky.addColorStop(1, '#8d3548');
  c.fillStyle = sky; c.fillRect(0, 0, LW, HORIZON + 6);

  // sun glow low on the horizon
  var sg = c.createRadialGradient(300, HORIZON - 4, 6, 300, HORIZON - 4, 250);
  sg.addColorStop(0, 'rgba(255,208,130,0.9)');
  sg.addColorStop(0.22, 'rgba(255,140,60,0.34)');
  sg.addColorStop(1, 'rgba(255,110,50,0)');
  c.fillStyle = sg; c.fillRect(0, 0, LW, HORIZON + 6);

  // stars
  var r = mulberry32(1337);
  for (var i = 0; i < 130; i++) {
    var sx = r() * LW, sy = r() * (HORIZON - 8);
    var a = (1 - sy / HORIZON) * 0.85 * r();
    c.fillStyle = 'rgba(255,238,214,' + a.toFixed(3) + ')';
    c.fillRect(sx | 0, sy | 0, r() > 0.85 ? 2 : 1, r() > 0.85 ? 2 : 1);
  }

  // --- ground --------------------------------------------------------
  var gr = c.createLinearGradient(0, HORIZON - 6, 0, LH);
  gr.addColorStop(0, '#5b2b17');
  gr.addColorStop(0.18, '#7a3d1e');
  gr.addColorStop(0.62, '#8d4d24');
  gr.addColorStop(1, '#5c2e17');
  c.fillStyle = gr; c.fillRect(0, HORIZON, LW, LH - HORIZON);

  // dusty speckle texture
  for (var d = 0; d < 5200; d++) {
    var px = r() * LW, py = HORIZON + r() * (LH - HORIZON);
    var v = r();
    c.fillStyle = v > 0.5 ? 'rgba(255,196,132,0.055)' : 'rgba(60,24,20,0.075)';
    c.fillRect(px | 0, py | 0, 1 + ((r() * 2) | 0), 1);
  }
  // faint furrow lines running across the orchard
  c.save();
  c.globalAlpha = 0.10;
  for (var fu = 0; fu < 16; fu++) {
    var fy2 = HORIZON + 14 + fu * 48 + r() * 12;
    c.strokeStyle = fu % 2 ? '#ffcf9a' : '#3d1a12';
    c.lineWidth = 1 + r() * 2;
    c.beginPath();
    c.moveTo(-20, fy2);
    c.bezierCurveTo(LW * 0.3, fy2 - 10 + r() * 20, LW * 0.7, fy2 + 8 - r() * 20, LW + 20, fy2 + r() * 8);
    c.stroke();
  }
  c.restore();

  // --- trees behind the arena (silhouettes, decor only) ---------------
  var treeTops = [90, 240, 430, 620, 830, 1010, 1190];

  for (var k = 0; k < 4; k++) {

/* ============================================================
   POOLS — particles & floating text (swap-remove, no GC churn)
   ============================================================ */
var MAXP = 700;
var parts = [], partPool = [];
function addPart(x, y, vx, vy, life, size, col, kind, grav) {
  var p;
  if (partPool.length) p = partPool.pop();
  else p = { x: 0, y: 0, vx: 0, vy: 0, t: 0, life: 1, size: 1, col: '#fff', kind: 0, grav: 0, rot: 0, vr: 0 };
  p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.t = 0; p.life = life;
  p.size = size; p.col = col; p.kind = kind || 0; p.grav = grav || 0;
  p.rot = Math.random() * TAU; p.vr = rnd(-9, 9);
  if (parts.length >= MAXP) {
    var old = parts[0];
    parts[0] = parts[parts.length - 1]; parts.pop(); partPool.push(old);
  }
  parts.push(p);
}
function updateParts(dt) {
  for (var i = parts.length - 1; i >= 0; i--) {
    var p = parts[i];
    p.t += dt;
    if (p.t >= p.life) {
      parts[i] = parts[parts.length - 1]; parts.pop(); partPool.push(p);
      continue;
    }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += p.grav * dt;
    p.rot += p.vr * dt;
    var damp = p.kind === 1 ? 1.4 : 2.6;
    var f = Math.exp(-damp * dt);
    p.vx *= f; p.vy *= f;
  }
}

var floats = [], floatPool = [];
function addFloat(x, y, s, col, size) {
  var f = floatPool.length ? floatPool.pop() : { x: 0, y: 0, s: '', col: '', t: 0, size: 20 };
  f.x = x; f.y = y; f.s = s; f.col = col; f.t = 0; f.size = size || 22;
  if (floats.length > 24) { var o = floats.shift(); floatPool.push(o); }
  floats.push(f);
}
function updateFloats(dt) {
  for (var i = floats.length - 1; i >= 0; i--) {
    var f = floats[i];
    f.t += dt;
    f.y -= 34 * dt * (1 - f.t / 1.25);
    if (f.t > 1.25) { floats[i] = floats[floats.length - 1]; floats.pop(); floatPool.push(f); }
  }
}

function burst(x, y, n, col, spd, life, size, kind) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * TAU, s = spd * (0.35 + Math.random() * 0.9);
    addPart(x, y, Math.cos(a) * s, Math.sin(a) * s, life * (0.6 + Math.random() * 0.7),
      size * (0.6 + Math.random() * 0.8), col, kind || 0, 0);
  }
}

function newEnemy() {

    speed: 100, score: 10, t: 0, flash: 0, hitCd: 0, emberCd: 0, shieldFlash: 0,
    facing: 0, phase: 0, timer: 0, wob: 0, alive: true, spawnT: 0, sc: 0
  };
