  ctx.globalAlpha = ta;
  txtGlow('CHOOSE YOUR UPGRADE', LW / 2, LH / 2 - 210, 44, 900, '#ffe9b0', 'rgba(255,150,50,0.6)', 'center', 8, 24);
  txt(usedTouch ? 'TAP A CARD' : 'PRESS 1, 2 OR 3 — OR CLICK', LW / 2, LH / 2 - 176, 16, 800, 'rgba(255,214,168,0.7)', 'center', 4);
  ctx.restore();

  for (var i = 0; i < 3; i++) {
    var c = D.cards[i];
    if (!c) continue;
    var r = cardRect(i);
    var rx = r.x, ry = r.y, rw = r.w, rh = r.h;
    var appear = clamp((D.t - i * 0.07) / 0.34, 0, 1);
    var ease = easeOutCubic(appear);
    var chosen = D.chosen === i;
    var fading = D.chosen >= 0 && !chosen;
    var hov = D.hover === i && D.chosen < 0;

    ctx.save();
    ctx.globalAlpha = (fading ? 1 - clamp(D.chosenT / 0.3, 0, 1) : 1) * ease;
    var lift = (1 - ease) * 60 + (hov ? -8 : 0) + (chosen ? -Math.min(18, D.chosenT * 60) : 0);
    ctx.translate(rx + rw / 2, ry + rh / 2 + lift);
    var sc = chosen ? 1 + Math.min(0.09, D.chosenT * 0.3) : (hov ? 1.03 : 1);
    ctx.scale(sc, sc);
    ctx.translate(-rw / 2, -rh / 2);

    // card body
    var cg = ctx.createLinearGradient(0, 0, 0, rh);
    cg.addColorStop(0, hov || chosen ? '#2c1740' : '#20122f');
    cg.addColorStop(1, hov || chosen ? '#160c26' : '#120a1e');
    roundRect(0, 0, rw, rh, 18);
    ctx.fillStyle = cg; ctx.fill();
    ctx.strokeStyle = chosen ? '#ffd166' : (hov ? 'rgba(255,209,102,0.75)' : 'rgba(255,180,110,0.28)');
    ctx.lineWidth = chosen ? 3.5 : 2;
    if (hov || chosen) { ctx.shadowColor = 'rgba(255,170,70,0.55)'; ctx.shadowBlur = 26; }
    ctx.stroke();
    ctx.shadowBlur = 0;

    // number chip
    roundRect(16, 16, 34, 34, 9);
    ctx.fillStyle = 'rgba(255,209,102,0.16)'; ctx.fill();
    txt(String(i + 1), 33, 40, 20, 900, '#ffd166', 'center', 0);

    // icon
    ctx.save();
    ctx.translate(rw / 2, 124);
    var gl = ctx.createRadialGradient(0, 0, 2, 0, 0, 62);
    gl.addColorStop(0, 'rgba(255,180,80,0.28)');
    gl.addColorStop(1, 'rgba(255,140,60,0)');
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, 62, 0, TAU); ctx.fill();
    ctx.restore();
    drawUpIcon(c.id, rw / 2, 124, 3.0, '#ffd166');

    // name + level
    txt(c.name, rw / 2, 214, 26, 900, '#ffe9b0', 'center', 3);
    var lv = c.id === 'bounty' ? 0 : (G.up[c.id] || 0);
    if (c.id !== 'bounty') {
      var dotY = 240;
      for (var d = 0; d < c.max; d++) {
        var dx2 = rw / 2 - (c.max - 1) * 9 + d * 18;
        ctx.beginPath(); ctx.arc(dx2, dotY, 5, 0, TAU);
        ctx.fillStyle = d < lv ? '#8ef7ff' : (d === lv ? '#ffd166' : 'rgba(255,255,255,0.14)');
        ctx.fill();
      }
      txt(lv > 0 ? ('LEVEL ' + lv + ' → ' + (lv + 1)) : 'NEW', rw / 2, 268, 13, 800, 'rgba(255,214,168,0.6)', 'center', 3);
    } else {
      txt('REPEATABLE', rw / 2, 246, 13, 800, 'rgba(255,214,168,0.6)', 'center', 3);
    }

    // blurb (wrapped)
    var words = c.blurb(lv).split(' ');
    var line = '', lines = [];
    setFont(17, 700, 0.5);
    for (var wi = 0; wi < words.length; wi++) {
      var test = line ? line + ' ' + words[wi] : words[wi];
      if (ctx.measureText(test).width > rw - 48 && line) { lines.push(line); line = words[wi]; }
      else line = test;
    }
    if (line) lines.push(line);
    for (var li = 0; li < lines.length; li++) {
      txt(lines[li], rw / 2, 306 + li * 24, 17, 700, 'rgba(255,224,190,0.85)', 'center', 0.5);
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // run summary strip
  txt('SCORE ' + G.score + '   •   WAVE ' + G.wave + ' CLEARED   •   BEST COMBO x' + G.bestCombo,
    LW / 2, LH / 2 + 258, 16, 800, 'rgba(255,214,168,0.55)', 'center', 3);
}

function drawEndScreen(won) {
  var t = clamp(G.overlayT / 0.7, 0, 1);
  dim(0.55 + 0.25 * t);
  ctx.save();
  ctx.globalAlpha = t;
  ctx.translate(LW / 2, LH / 2 - 150 + (1 - easeOutCubic(t)) * 30);

  if (won) {
    txtGlow('THE ORCHARD HOLDS', 0, 0, 62, 900, '#ffe9b0', 'rgba(255,170,60,0.8)', 'center', 8, 32);
    txt('The Magpie is scrap. Many happy returns.', 0, 38, 20, 700, 'rgba(255,214,168,0.85)', 'center', 2);
  } else {
    txtGlow('THE ORCHARD FALLS', 0, 0, 62, 900, '#ff9a6a', 'rgba(255,90,60,0.7)', 'center', 8, 32);
    txt('Wave ' + G.waveReached + ' of 10. The locusts take the last of the fruit.', 0, 38, 20, 700, 'rgba(255,190,150,0.85)', 'center', 2);
  }
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = clamp((G.overlayT - 0.2) / 0.6, 0, 1);
  txt('FINAL SCORE', LW / 2, LH / 2 - 52, 15, 800, 'rgba(255,214,168,0.55)', 'center', 5);
  txtGlow(String(G.score), LW / 2, LH / 2 + 12, 76, 900, '#ffd166', 'rgba(255,170,60,0.7)', 'center', 3, 26);

  var stats = [
    ['WAVE', String(G.waveReached)],
    ['DRONES', String(G.kills)],
    ['BEST COMBO', 'x' + G.bestCombo],
    ['CLEAN CATCHES', String(G.cleanCatches)],
    ['FUMBLES', String(G.fumbles)]
  ];
  var sx = LW / 2 - (stats.length - 1) * 82;
  for (var i = 0; i < stats.length; i++) {
    var x = sx + i * 164;
    txt(stats[i][0], x, LH / 2 + 56, 12, 800, 'rgba(255,214,168,0.45)', 'center', 3);
    txt(stats[i][1], x, LH / 2 + 84, 26, 900, '#ffe9b0', 'center', 1);
  }

  // restart button
  var hovBtn = mouseInside && pointInRect(G.aimX, G.aimY, restartBtn);
  roundRect(restartBtn.x, restartBtn.y, restartBtn.w, restartBtn.h, 14);
  ctx.fillStyle = hovBtn ? 'rgba(255,209,102,0.22)' : 'rgba(255,209,102,0.10)';
  ctx.fill();
  ctx.strokeStyle = hovBtn ? '#ffd166' : 'rgba(255,209,102,0.6)';
  ctx.lineWidth = 2.4; ctx.stroke();
  txt(usedTouch ? 'TAP TO PLAY AGAIN' : 'PRESS R TO PLAY AGAIN',
    LW / 2, restartBtn.y + 36, 20, 900, '#ffe9b0', 'center', 4);
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ============================================================
   RENDER
   ============================================================ */
function drawWorld() {
  ctx.drawImage(bg, 0, 0);
  drawEmbers();
  drawPortals();

  if (G.boom.state === 'ground') drawBoomerang();

  for (var i = 0; i < G.enemies.length; i++) drawEnemy(G.enemies[i]);
  drawBoss();
  drawPlayer();
  if (G.boom.state !== 'ground') drawBoomerang();
  drawParts();
  drawAim();
  drawFloats();

  if (G.flashT > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(G.flashT / 0.22, 0, 1);
    ctx.fillStyle = G.flashCol;
    ctx.fillRect(0, 0, LW, LH);
    ctx.restore();
  }
}

function render() {
  var d = view.dpr;
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.fillStyle = '#07040f';
  ctx.fillRect(0, 0, view.cw, view.ch);

  ctx.save();
  ctx.translate(view.offX, view.offY);
  ctx.scale(view.scale, view.scale);
  ctx.beginPath(); ctx.rect(0, 0, LW, LH); ctx.clip();

  ctx.save();
  if (G.shake > 0.05) ctx.translate(G.shakeX, G.shakeY);
  drawWorld();
  ctx.restore();

  drawHUD();

  if (G.state === 'title') drawTitle();
  else if (G.state === 'paused') drawPause();
  else if (G.state === 'draft') drawDraft();
  else if (G.state === 'gameover') drawEndScreen(false);
  else if (G.state === 'win') drawEndScreen(true);

  ctx.restore();
}

/* ============================================================
   LOOP
   ============================================================ */
var lastT = 0, rafId = 0, lastCursor = null;
function frame(now) {
  rafId = requestAnimationFrame(frame);
  if (!lastT) lastT = now;
  var dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;      // clamp long frames (tab switch, hitching)
  if (dt < 0) dt = 0;
  update(dt);
  updateAudioLoop(dt);
  render();
  var cur = (G.state === 'playing' && !usedTouch) ? '' : 'uicursor';
  if (cur !== lastCursor) { canvas.className = cur; lastCursor = cur; }
}

function boot() {
  resize();
  bakeBackground();
  resetGame();
  G.state = 'title';
  G.uiTime = 0;
  if (!rafId) rafId = requestAnimationFrame(frame);
}
boot();
})();
</script>
