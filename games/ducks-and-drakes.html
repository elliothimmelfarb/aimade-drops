<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="DUCKS &amp; DRAKES - a one-button stone-skipping game across five dusk lakes. Hold to charge, release to throw, tap every time the stone kisses the water.">
<title>DUCKS &amp; DRAKES</title>
<style>
  :root{
    --ink:#f6ecdf;
    --dim:rgba(246,236,223,.56);
    --faint:rgba(246,236,223,.34);
    --gold:#ffc773;
    --amber:#ff9145;
    --rose:#ff7a6b;
    --teal:#7fe3d2;
    --night:#070914;
    --panel:rgba(11,14,30,.72);
    --ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:#070914;color:var(--ink);
    font-family:var(--ui);
    overflow:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
    touch-action:none;
  }
  #wrap{position:fixed;inset:0;overflow:hidden;background:#070914;}
  canvas#game{position:absolute;left:0;top:0;display:block;touch-action:none;}

  /* ---------------- HUD ---------------- */
  #hud{
    position:absolute;left:0;right:0;top:0;z-index:5;pointer-events:none;
    padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
    opacity:0;transition:opacity .5s ease;
  }
  #hud.on{opacity:1;}
  .hcol{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .hcol.c{align-items:center;text-align:center;}
  .hcol.r{align-items:flex-end;text-align:right;}
  .lbl{
    font-size:9px;letter-spacing:.26em;text-transform:uppercase;font-weight:700;
    color:var(--faint);text-shadow:0 1px 5px rgba(3,6,16,.9);white-space:nowrap;
  }
  .val{
    font-size:22px;line-height:1;font-weight:650;font-variant-numeric:tabular-nums;
    letter-spacing:.01em;color:#fff5e6;text-shadow:0 2px 14px rgba(3,8,20,.9);
    transition:transform .16s cubic-bezier(.2,1.8,.4,1);transform-origin:0 50%;white-space:nowrap;
  }
  .hcol.c .val{transform-origin:50% 50%;font-size:15px;}
  .hcol.r .val{transform-origin:100% 50%;font-size:17px;color:#ffe9c6;}
  .val.pop{transform:scale(1.22);}
  #stones{display:flex;gap:5px;margin-top:2px;}
  .sdot{
    width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 35% 32%, #ffdca5, #b07c3f 68%, #5d3f1e);
    box-shadow:0 0 8px rgba(255,180,100,.45);
    transition:opacity .3s ease, transform .3s ease;
  }
  .sdot.spent{opacity:.2;transform:scale(.72);background:#3a3a4a;box-shadow:none;}
  #windRow{display:flex;align-items:center;gap:6px;margin-top:2px;}
  #windArrow{font-size:14px;line-height:1;color:var(--gold);text-shadow:0 0 10px rgba(255,180,90,.5);}
  #windBars{display:flex;gap:3px;}
  .wbar{width:3px;height:9px;border-radius:2px;background:rgba(246,236,223,.16);}
  .wbar.on{background:var(--gold);box-shadow:0 0 6px rgba(255,190,110,.6);}

  /* ---------------- mute ---------------- */
  #mute{
    position:absolute;z-index:8;pointer-events:auto;
    right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));
    width:38px;height:38px;border-radius:11px;border:1px solid rgba(246,236,223,.16);
    background:rgba(9,12,26,.55);color:var(--ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    opacity:.5;transition:opacity .2s ease,transform .12s ease,border-color .2s ease;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  #mute:hover{opacity:.95;border-color:rgba(255,199,115,.4);}
  #mute:active{transform:scale(.92);}
  #mute svg{width:19px;height:19px;display:block;}
  #mute .slash{opacity:0;transition:opacity .15s ease;}
  #mute.off .slash{opacity:1;}
  #mute.off .wave{opacity:.18;}

  /* ---------------- screens ---------------- */
  #screen{
    position:absolute;inset:0;z-index:6;pointer-events:none;
    display:flex;align-items:center;justify-content:center;
    padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
    opacity:0;transition:opacity .35s ease;
  }
  #screen.on{opacity:1;}
  #card{
    position:relative;max-width:min(560px,92vw);width:100%;
    padding:clamp(18px,3.6vh,30px) clamp(18px,4vw,34px);
    border-radius:20px;text-align:center;
    background:linear-gradient(180deg, rgba(14,17,36,.82), rgba(7,9,20,.9));
    border:1px solid rgba(246,236,223,.13);
    box-shadow:0 24px 70px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    transform:translateY(10px) scale(.985);opacity:0;
    transition:transform .42s cubic-bezier(.16,1,.3,1), opacity .38s ease;
  }
  #screen.on #card{transform:none;opacity:1;}
  #card.bare{background:none;border:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;}

  #scEyebrow{
    font-size:10px;letter-spacing:.38em;text-transform:uppercase;font-weight:700;
    color:var(--faint);margin-bottom:10px;
  }
  #scTitle{
    font-size:clamp(30px,7.6vw,58px);line-height:.98;font-weight:800;
    letter-spacing:.055em;margin:0;
    background:linear-gradient(178deg,#fff6e6 6%,#ffc773 46%,#ff8f4a 96%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 24px rgba(255,140,60,.28));
    text-transform:uppercase;
  }
  /* note: no opacity/filter on this span - a child compositing group would
     punch a hole in the parent's background-clip:text gradient */
  #scTitle .amp{font-size:.6em;vertical-align:.12em;letter-spacing:.02em;}
  #scTitle.sm{font-size:clamp(24px,5.4vw,40px);letter-spacing:.09em;}
  #scRule{
    width:70px;height:2px;margin:14px auto;border-radius:2px;
    background:linear-gradient(90deg,transparent,rgba(255,199,115,.85),transparent);
  }
  #scSub{
    font-size:clamp(12px,1.6vh,14px);line-height:1.55;color:var(--dim);
    margin:0 auto;max-width:40ch;
  }
  #scBody{margin-top:16px;}
  #scBody:empty{display:none;}

  .keys{
    display:flex;flex-wrap:wrap;gap:8px 10px;justify-content:center;margin-top:2px;
  }
  .key{
    display:flex;align-items:center;gap:7px;
    font-size:11px;letter-spacing:.06em;color:var(--dim);
    background:rgba(255,255,255,.035);border:1px solid rgba(246,236,223,.1);
    border-radius:9px;padding:6px 10px;
  }
  .key b{
    font-weight:700;color:#ffe3b4;letter-spacing:.1em;font-size:10px;
    background:rgba(255,199,115,.11);border:1px solid rgba(255,199,115,.24);
    border-radius:5px;padding:2px 6px;white-space:nowrap;
  }

  .tally{display:flex;flex-direction:column;gap:1px;margin:0 auto;max-width:340px;}
  .trow{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    padding:7px 2px;border-bottom:1px solid rgba(246,236,223,.07);
    opacity:0;transform:translateY(6px);
    animation:rowIn .42s cubic-bezier(.16,1,.3,1) forwards;
  }
  .trow.tot{border-bottom:none;margin-top:6px;padding-top:11px;border-top:1px solid rgba(255,199,115,.26);}
  .trow .tk{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);}
  .trow .tv{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;color:#ffeccd;}
  .trow.tot .tk{color:var(--dim);}
  .trow.tot .tv{font-size:26px;color:var(--gold);text-shadow:0 0 26px rgba(255,180,90,.4);}
  .trow .tv.neg{color:rgba(246,236,223,.4);}
  @keyframes rowIn{to{opacity:1;transform:none;}}

  #scPrompt{
    margin-top:20px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;
    font-weight:700;color:#ffd9a0;
    animation:pulse 1.75s ease-in-out infinite;
  }
  #scPrompt:empty{display:none;}
  #scPrompt .sp{color:var(--faint);letter-spacing:.14em;font-weight:600;}
  @keyframes pulse{0%,100%{opacity:.42;}50%{opacity:1;}}

  #scFoot{
    margin-top:12px;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(246,236,223,.26);
  }
  #scFoot:empty{display:none;}

  #best{
    margin-top:14px;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);
  }
  #best b{color:#ffe0ae;font-weight:700;letter-spacing:.12em;}
  #best:empty{display:none;}

  /* toast for wasted flick / notices handled on canvas */
  @media (max-height:470px){
    #scRule{margin:8px auto;width:52px;}
    #scBody{margin-top:9px;}
    #scPrompt{margin-top:11px;}
    #best{margin-top:9px;}
    .trow{padding:3.5px 2px;}
    #scTitle{font-size:clamp(22px,5.4vw,38px);}
    #scTitle.sm{font-size:clamp(19px,4.4vw,30px);}
    #scSub{font-size:11.5px;line-height:1.45;}
    #scEyebrow{margin-bottom:6px;}
    #card{padding:14px 20px;border-radius:16px;}
    .key{padding:4px 8px;font-size:10px;}
    #scFoot{display:none;}
  }
  /* keep the lake name from crowding the distance readout on phones */
  @media (max-width:560px){ .lname{display:none;} }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hcol">
      <div class="lbl">Score</div>
      <div class="val" id="hScore">0</div>
      <div id="stones"></div>
    </div>
    <div class="hcol c">
      <div class="lbl" id="hLakeLbl">Lake 1 of 5</div>
      <div class="val" id="hChain">&nbsp;</div>
    </div>
    <div class="hcol r">
      <div class="lbl">To shore</div>
      <div class="val" id="hDist">0m</div>
      <div id="windRow">
        <div id="windBars"></div>
        <div id="windArrow">&mdash;</div>
      </div>
    </div>
  </div>

  <div id="screen">
    <div id="card">
      <div id="scEyebrow"></div>
      <h1 id="scTitle"></h1>
      <div id="scRule"></div>
      <div id="scSub"></div>
      <div id="scBody"></div>
      <div id="best"></div>
      <div id="scPrompt"></div>
      <div id="scFoot"></div>
    </div>
  </div>

  <button id="mute" aria-label="Toggle sound">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9.2h3.4L12 5.2v13.6l-4.6-4H4z" fill="currentColor" fill-opacity=".22"></path>
      <path class="wave" d="M15.4 9.1a4 4 0 0 1 0 5.8"></path>
      <path class="wave" d="M18 6.6a7.6 7.6 0 0 1 0 10.8"></path>
      <path class="slash" d="M3.5 3.5l17 17" stroke="#ff7a6b"></path>
    </svg>
  </button>
</div>
<!-- aimade.games Arcade SDK -->
<script src="https://aimade.games/arcade.js"></script>
<script>
  // Additive, fail-safe bridge to the arcade. Never throws into the game.
  window.__arcade = null;
  (function () {
    try { Arcade.ready().then(function (a) { window.__arcade = a; }); } catch (e) {}
  })();
  function arcadeSubmit(score, meta) {
    try {
      if (typeof score !== 'number' || !isFinite(score)) return;
      Arcade.ready().then(function (a) { a.scores.submit(score, meta || {}); }).catch(function () {});
    } catch (e) {}
  }
  function arcadeUnlock(slug) {
    try { Arcade.ready().then(function (a) { a.achievements.unlock(slug); }).catch(function () {}); } catch (e) {}
  }
</script>
<script>
(function(){
'use strict';

/* =====================================================================
   DUCKS & DRAKES
   One-button stone skipping across five dusk lakes.
   World units are "metres"; water surface is y = 0, +y is up.
   Physics runs on a fixed 120Hz accumulator; rendering on rAF.
   ===================================================================== */

/* ------------------------------ tuning ------------------------------ */
var DT        = 1/120;      // fixed physics step (s)
var MAXFRAME  = 0.10;       // clamp on frame delta (s) -> no spiral of death
var G         = 26.0;       // gravity (u/s^2) - floaty-readable
var AIR       = 0.020;      // passive horizontal drag coefficient (1/s)
var STONE_R   = 0.28;       // stone radius (u)
var LAUNCH_X  = 1.25;
var LAUNCH_Y  = 1.52;

// timing windows, milliseconds
var PERFECT_MS = 45;        // |dt| <= this  -> PERFECT
var GOOD_MS    = 105;       // |dt| <= this  -> GOOD
var LATE_MS    = 92;        // grace after contact before it is called sloppy
var WASTE_MS   = 155;       // a tap this long before any contact is a wasted flick

// skip response
var RET_PERFECT = 0.965, BNC_PERFECT = 0.166;
var RET_HYDRO   = 1.021, BNC_HYDRO   = 0.130;
var HYDRO_ADD   = 0.75;     // additive push, so a plane always builds speed
var RET_GOOD    = 0.850, BNC_GOOD    = 0.262;
var RET_SLOPPY  = 0.600, BNC_SLOPPY  = 0.430;
var MIN_VY      = 2.45;     // floor on bounce so contacts never machine-gun
var VX_MAX      = 34.0;     // ceiling so a long plane cannot outrun the eye
var PLUNK_VX    = 8.0;      // below this the stone sinks
var SLOPPY_PLUNK_VX = 9.0;  // a sloppy at this speed or less drowns the stone
var SKID_FRICTION = 0.60;   // drag while the stone hesitates on the surface

var CHARGE_PERIOD = 1.20;   // full 0->100->0 sweep (s)
var PWR_V0 = 15.0, PWR_V1 = 31.0;          // launch speed range
var PWR_A0 = 42*Math.PI/180, PWR_A1 = 6*Math.PI/180; // launch angle range
var HYDRO_CHAIN = 3;

var ANCHOR = 0.34;          // stone rests at this fraction of screen width
var VIEW_H = 13.0;          // world units of height we try to show
var VIEW_W = 24.0;          // world units of width we try to show
var SCALE_MAX = 84;

var DUCK_R    = 1.25;       // splash radius that startles a duck
var DUCK_WARN = 16;         // how far ahead a plane is warned about ducks
var BUOY_R    = 0.56, BUOY_H = 1.55;
var PAD_HW    = 1.10;

var LAKES = [
  { dist: 76,  wind: 0.00, groups: 1, dspd: 0.42, buoys: 0, pads: 0, name:'MILLPOND' },
  { dist: 100, wind: 0.40, groups: 2, dspd: 0.62, buoys: 1, pads: 0, name:'THE NARROWS' },
  { dist: 126, wind: 0.70, groups: 3, dspd: 0.82, buoys: 2, pads: 2, name:'REEDMERE' },
  { dist: 150, wind: 0.95, groups: 4, dspd: 1.02, buoys: 3, pads: 4, name:'DRAKE WATER' },
  { dist: 178, wind: 1.20, groups: 5, dspd: 1.22, buoys: 4, pads: 6, name:'THE LONG LOCH' }
];
var STONES_PER_LAKE = 3;

/* ------------------------------ helpers ----------------------------- */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function easeOut(t){ t=clamp(t,0,1); return 1-(1-t)*(1-t); }
function smoothTo(cur,tgt,rate,dt){ return cur + (tgt-cur)*(1-Math.exp(-rate*dt)); }

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// cheap stable hash -> 0..1, used for shimmer that must not allocate
function hash1(n){ var s = Math.sin(n*127.1)*43758.5453; return s - Math.floor(s); }

/* ------------------------------ audio ------------------------------- */
var Snd = {
  ctx:null, master:null, noise:null, muted:false, ready:false,
  chargeOsc:null, chargeGain:null, chargeFilt:null,

  init:function(){
    if (this.ctx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch(e){ this.ctx = null; return; }
    var c = this.ctx;
    this.master = c.createGain();
    this.master.gain.value = this.muted ? 0 : 0.30;
    this.master.connect(c.destination);
    var len = Math.floor(c.sampleRate * 1.2);
    var buf = c.createBuffer(1, len, c.sampleRate);
    var d = buf.getChannelData(0);
    for (var i=0;i<len;i++) d[i] = Math.random()*2-1;
    this.noise = buf;
    this.ready = true;
  },
  unlock:function(){
    this.init();
    if (this.ctx && this.ctx.state === 'suspended') { try{ this.ctx.resume(); }catch(e){} }
  },
  setMuted:function(m){
    this.muted = m;
    if (this.master && this.ctx) {
      var t = this.ctx.currentTime;
      this.master.gain.cancelScheduledValues(t);
      this.master.gain.setTargetAtTime(m?0:0.30, t, 0.02);
    }
    if (m) this.chargeStop();
  },
  now:function(){ return this.ctx ? this.ctx.currentTime : 0; },

  // simple enveloped oscillator
  tone:function(freq, dur, type, vol, delay, glideTo, curve){
    if (!this.ready || this.muted) return;
    var c = this.ctx, t0 = c.currentTime + (delay||0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,glideTo), t0+dur);
    var atk = Math.min(0.012, dur*0.3);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0+atk);
    if (curve === 'flat') {
      g.gain.setValueAtTime(Math.max(0.0002,vol), t0+dur*0.6);
    }
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0+dur+0.03);
  },
  burst:function(dur, cut, vol, delay, type, q, glideCut){
    if (!this.ready || this.muted) return;
    var c = this.ctx, t0 = c.currentTime + (delay||0);
    var s = c.createBufferSource(); s.buffer = this.noise;
    s.playbackRate.value = 0.85 + Math.random()*0.3;
    var f = c.createBiquadFilter(); f.type = type || 'lowpass';
    f.frequency.setValueAtTime(cut, t0);
    if (glideCut) f.frequency.exponentialRampToValueAtTime(Math.max(60,glideCut), t0+dur);
    f.Q.value = q || 0.8;
    var g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol), t0+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t0); s.stop(t0+dur+0.03);
  },

  skip:function(step, hydro){
    // pentatonic ladder
    var PENT = [0,2,4,7,9,12,14,16,19,21,24,26];
    var i = clamp(step|0, 0, PENT.length-1);
    var f = 392 * Math.pow(2, PENT[i]/12);
    this.tone(f, hydro?0.18:0.13, 'triangle', hydro?0.20:0.16, 0);
    this.tone(f*2, 0.055, 'sine', 0.07, 0);
    this.burst(0.06, 2600, hydro?0.05:0.075, 0, 'highpass', 0.7);
  },
  good:function(){
    this.tone(330, 0.10, 'triangle', 0.11, 0);
    this.burst(0.075, 1500, 0.085, 0, 'lowpass', 0.8);
  },
  sloppy:function(){
    this.tone(92, 0.20, 'sine', 0.20, 0, 58);
    this.burst(0.26, 1100, 0.19, 0, 'lowpass', 0.9, 260);
  },
  plunk:function(){
    this.tone(400, 0.42, 'sine', 0.19, 0, 62);
    this.burst(0.34, 700, 0.15, 0.02, 'lowpass', 1.1, 140);
    this.tone(150, 0.30, 'sine', 0.09, 0.05, 70);
  },
  thup:function(){
    this.tone(190, 0.10, 'sine', 0.16, 0, 110);
    this.burst(0.13, 480, 0.14, 0, 'lowpass', 1.0);
  },
  bonk:function(){
    this.tone(160, 0.22, 'square', 0.13, 0, 96);
    this.tone(320, 0.10, 'triangle', 0.08, 0, 210);
    this.burst(0.10, 900, 0.09, 0, 'lowpass', 1.0);
  },
  quack:function(){
    if (!this.ready || this.muted) return;
    var self = this;
    function q(delay, f0, f1, vol, dur){
      var c = self.ctx, t0 = c.currentTime + delay;
      var o = c.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(f0, t0);
      o.frequency.linearRampToValueAtTime(f1, t0+dur*0.85);
      var bp = c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = 1150; bp.Q.value = 2.4;
      var lp = c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 2600;
      var g = c.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0+0.012);
      g.gain.setValueAtTime(vol, t0+dur*0.55);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
      o.connect(bp); bp.connect(lp); lp.connect(g); g.connect(self.master);
      o.start(t0); o.stop(t0+dur+0.03);
    }
    q(0.00, 560, 300, 0.20, 0.115);
    q(0.145, 470, 250, 0.16, 0.135);
  },
  wasted:function(){
    this.tone(240, 0.045, 'square', 0.055, 0, 170);
  },
  fanfare:function(){
    var base = 392, seq = [0,4,7,12], i;
    for (i=0;i<seq.length;i++){
      var f = base*Math.pow(2,seq[i]/12);
      this.tone(f, 0.34, 'triangle', 0.17, i*0.105);
      this.tone(f*2, 0.22, 'sine', 0.06, i*0.105);
    }
    this.tone(base*Math.pow(2,16/12), 0.72, 'triangle', 0.15, 0.44);
    this.tone(base*Math.pow(2,19/12), 0.72, 'sine', 0.09, 0.46);
  },
  sad:function(){
    var seq = [0,-3,-5,-12], i;
    for (i=0;i<seq.length;i++){
      this.tone(330*Math.pow(2,seq[i]/12), 0.42, 'triangle', 0.13, i*0.16);
    }
  },
  win:function(){
    var base = 523.25, seq = [0,4,7,12,16,19];
    for (var i=0;i<seq.length;i++){
      this.tone(base*Math.pow(2,seq[i]/12), 0.5, 'triangle', 0.15, i*0.09);
      this.tone(base*Math.pow(2,seq[i]/12)*0.5, 0.5, 'sine', 0.07, i*0.09);
    }
  },
  throwWhoosh:function(p){
    this.burst(0.20, 700+p*1400, 0.10+p*0.06, 0, 'bandpass', 1.2, 300);
  },
  chargeStart:function(){
    if (!this.ready || this.muted || this.chargeOsc) return;
    var c = this.ctx, t = c.currentTime;
    var o = c.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(110, t);
    var o2 = c.createOscillator(); o2.type='sine'; o2.frequency.setValueAtTime(220, t);
    var f = c.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(700,t); f.Q.value=2;
    var g = c.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.055, t+0.07);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(this.master);
    o.start(t); o2.start(t);
    this.chargeOsc = o; this.chargeOsc2 = o2; this.chargeGain = g; this.chargeFilt = f;
  },
  chargeSet:function(p){
    if (!this.chargeOsc || !this.ctx) return;
    var t = this.ctx.currentTime;
    this.chargeOsc.frequency.setTargetAtTime(104 + p*150, t, 0.03);
    this.chargeOsc2.frequency.setTargetAtTime(208 + p*320, t, 0.03);
    this.chargeFilt.frequency.setTargetAtTime(560 + p*1500, t, 0.04);
  },
  chargeStop:function(){
    if (!this.chargeOsc || !this.ctx) return;
    var t = this.ctx.currentTime, g = this.chargeGain, o = this.chargeOsc, o2 = this.chargeOsc2;
    try{
      g.gain.cancelScheduledValues(t);
      g.gain.setValueAtTime(Math.max(0.0002, g.gain.value), t);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.06);
      o.stop(t+0.09); o2.stop(t+0.09);
    }catch(e){}
    this.chargeOsc = null; this.chargeOsc2 = null; this.chargeGain = null; this.chargeFilt = null;
  }
};

/* ------------------------------ pools ------------------------------- */
// particles: one flat pool, reused, never reallocated during play
var PMAX = 380;

}
function clearP(){ for (var i=0;i<PMAX;i++) P[i].on = false; }

// ripple rings on the water
